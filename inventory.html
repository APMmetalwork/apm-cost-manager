<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory -- APM Metal Works</title>
<script>
(function(){
  var K='apm_auth',T=10*60*60*1000;
  try{var s=JSON.parse(sessionStorage.getItem(K));if(!s||Date.now()-s.ts>T)throw 0;}
  catch(e){window.location.href='login.html';return;}
  document.addEventListener('DOMContentLoaded',function(){
    document.body.style.display='none';
    var gate=document.createElement('div');gate.id='mod-gate';
    gate.innerHTML='<style>'
      +'#mod-gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;'
      +'background:var(--bg,#fff);z-index:9999;font-family:inherit}'
      +'#mod-gate .gc{width:100%;max-width:360px;padding:24px;border:1px solid var(--border,#d8d8d8);'
      +'border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.08)}'
      +'#mod-gate h2{font-size:17px;font-weight:700;margin-bottom:4px}'
      +'#mod-gate p{font-size:13px;color:var(--text3,#888);margin-bottom:20px}'
      +'#mod-gate label{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;'
      +'text-transform:uppercase;color:var(--text3,#888);margin-bottom:7px}'
      +'#mod-gate input{width:100%;padding:11px 13px;border:1px solid var(--border,#d8d8d8);'
      +'border-radius:6px;background:var(--bg1,#f5f5f5);color:var(--text,#0a0a0a);'
      +'font-size:14px;font-family:inherit;box-sizing:border-box}'
      +'#mod-gate input:focus{outline:none;border-color:#C8A96E}'
      +'#mod-gate input.err{border-color:#C0392B}'
      +'#mod-gate .errmsg{display:none;color:#C0392B;font-size:12.5px;margin-top:8px}'
      +'#mod-gate .errmsg.show{display:block}'
      +'#mod-gate button{width:100%;margin-top:14px;padding:11px;background:#C8A96E;'
      +'border:none;border-radius:6px;color:#0a0a0a;font-size:14px;font-weight:700;cursor:pointer}'
      +'#mod-gate button:hover{background:#A8874E}'
      +'#mod-gate button:disabled{opacity:.6;cursor:not-allowed}'
      +'</style>'
      +'<div class="gc"><h2>Inventory</h2>'
      +'<p>Enter the module password to continue.</p>'
      +'<label>Password</label>'
      +'<input id="mgpw" type="password" placeholder="Password" />'
      +'<div class="errmsg" id="mgerr">Incorrect password.</div>'
      +'<button id="mgbtn" onclick="mgCheck()">Open</button></div>';
    document.body.parentNode.insertBefore(gate,document.body);
    document.getElementById('mgpw').addEventListener('keydown',function(e){
      if(e.key==='Enter'){e.preventDefault();mgCheck();}
    });
    document.getElementById('mgpw').addEventListener('input',function(){
      document.getElementById('mgerr').classList.remove('show');
      document.getElementById('mgpw').classList.remove('err');
    });
    setTimeout(function(){document.getElementById('mgpw').focus();},80);
  });
  window.mgCheck=function(){
    var pw=document.getElementById('mgpw').value;
    var btn=document.getElementById('mgbtn');
    btn.disabled=true;btn.textContent='Checking...';
    fetch('https://spfztpokbpomqtiqgggz.supabase.co/rest/v1/apm_settings?key=eq.mod_pass_inventory&select=value',{
      headers:{'apikey':'sb_publishable_xPXU0xL_YaiWA6k9PWc0Xg_4QYeypNi','Authorization':'Bearer sb_publishable_xPXU0xL_YaiWA6k9PWc0Xg_4QYeypNi'}
    })
    .then(function(r){return r.json();})
    .then(function(d){
      var correct=d&&d[0]&&d[0].value;
      if(correct&&pw===correct){
        document.getElementById('mod-gate').remove();
        document.body.style.display='';
      }else{
        document.getElementById('mgerr').classList.add('show');
        document.getElementById('mgpw').classList.add('err');
        document.getElementById('mgpw').value='';
        document.getElementById('mgpw').focus();
        btn.disabled=false;btn.textContent='Open';
      }
    })
    .catch(function(){
      document.getElementById('mgerr').textContent='Could not connect. Check your internet.';
      document.getElementById('mgerr').classList.add('show');
      btn.disabled=false;btn.textContent='Open';
    });
  };
})();
(function(){var t=localStorage.getItem('apm_theme')||'light';document.documentElement.setAttribute('data-theme',t);})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#C8A96E;--gold-dk:#A8874E;--black:#0A0A0A;--bg:#FFFFFF;--bg1:#F5F5F5;--bg2:#EBEBEB;--border:#D8D8D8;--text:#0A0A0A;--text2:#444444;--text3:#888888;--shadow:rgba(0,0,0,.07)}
[data-theme="dark"]{--bg:#0A0A0A;--bg1:#141414;--bg2:#1E1E1E;--border:#2A2A2A;--text:#F0F0F0;--text2:#AAAAAA;--text3:#666666;--shadow:rgba(0,0,0,.35)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button{font-family:inherit;cursor:pointer}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:56px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:40}
.topbar-left{display:flex;align-items:center;gap:16px}
.brand-link{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.brand-mark{width:30px;height:30px;border-radius:6px;background:var(--gold);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--black);flex:none}
.brand-name{font-size:14px;font-weight:700;letter-spacing:-.01em}
.page-label{font-size:13.5px;color:var(--text3);padding-left:16px;border-left:1px solid var(--border)}
.topbar-right{display:flex;align-items:center;gap:10px}
.theme-btn{width:32px;height:32px;border-radius:6px;background:transparent;border:1px solid var(--border);color:var(--text2);display:grid;place-items:center;transition:border-color .15s}
.theme-btn:hover{border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;font-size:13.5px;font-weight:600;border:1px solid var(--border);background:var(--bg1);color:var(--text);cursor:pointer;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--gold)}.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--black)}.btn-gold:hover{background:var(--gold-dk);border-color:var(--gold-dk)}
.btn-danger{color:#C0392B;border-color:#C0392B33}.btn-danger:hover{border-color:#C0392B}
.btn-sm{padding:6px 12px;font-size:12.5px}
.wrap{max-width:1200px;margin:0 auto;padding:28px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:24px}
.stat-cell{background:var(--bg);padding:18px 22px;border-right:1px solid var(--border)}.stat-cell:last-child{border-right:none}
.stat-lbl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.stat-val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}.stat-val.gold{color:var(--gold-dk)}.stat-val.red{color:#C0392B}
.alertbar{display:flex;gap:10px;align-items:center;padding:12px 16px;border:1px solid #C0392B44;background:#FDF2F2;border-radius:8px;font-size:13.5px;margin-bottom:20px;color:#922B21}
[data-theme="dark"] .alertbar{background:#1A0A0A;border-color:#5C1A1A;color:#F08080}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.search-input{padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg1);color:var(--text);font-size:13.5px;min-width:220px;flex:1;max-width:320px}
.search-input:focus{outline:none;border-color:var(--gold)}
.filter-tabs{display:flex;gap:2px;background:var(--bg1);border:1px solid var(--border);border-radius:6px;padding:3px}
.ftab{background:transparent;border:none;color:var(--text3);padding:6px 14px;border-radius:4px;font-size:13px;font-weight:500;cursor:pointer}
.ftab.active{background:var(--bg);color:var(--text);font-weight:600;box-shadow:0 1px 3px var(--shadow)}
.tbl-wrap{border:1px solid var(--border);border-radius:8px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{background:var(--bg1);padding:11px 16px;text-align:left;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.rc{cursor:pointer}tbody tr.rc:hover{background:var(--bg1)}
tbody tr.low-row{background:#FDF8F0}[data-theme="dark"] tbody tr.low-row{background:#1A1500}
.mono{font-variant-numeric:tabular-nums;font-size:13px}.dim{color:var(--text3);font-size:12.5px}
.badge{display:inline-block;padding:3px 9px;border-radius:4px;font-size:11.5px;font-weight:600;border:1px solid}
.empty{padding:52px 20px;text-align:center;color:var(--text3);font-size:14px}.empty strong{display:block;color:var(--text);margin-bottom:4px}
.qbtn{width:26px;height:26px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:13px;font-weight:700;display:grid;place-items:center;cursor:pointer}
.qbtn:hover{border-color:var(--gold);color:var(--text)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:5vh 16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--bg);border:1px solid var(--border);border-radius:10px;width:100%;max-width:500px;padding:28px;box-shadow:0 8px 32px var(--shadow)}
.modal h2{font-size:17px;font-weight:700;margin-bottom:20px}
.field{margin-bottom:14px}.field label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.field input,.field select{width:100%;background:var(--bg1);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:9px 11px;font-size:14px}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.f2{grid-template-columns:1fr}}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;border-top:1px solid var(--border);padding-top:20px}
.mfl{margin-right:auto}
#toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:90}
.toast{background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:7px;padding:11px 16px;font-size:13.5px;min-width:220px;box-shadow:0 4px 16px var(--shadow);animation:tin .2s ease}
.toast.err{border-left-color:#C0392B}
@keyframes tin{from{transform:translateX(12px);opacity:0}}
.loading{padding:60px;text-align:center;color:var(--text3)}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <a class="brand-link" href="dashboard.html"><div class="brand-mark">AP</div><span class="brand-name">APM Metal Works</span></a>
    <span class="page-label">Inventory</span>
  </div>
  <div class="topbar-right">
    <button class="theme-btn" onclick="toggleTheme()"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3.05 3.05l1.06 1.06M11.89 11.89l1.06 1.06M3.05 12.95l1.06-1.06M11.89 4.11l1.06-1.06"/></svg></button>
    <button class="btn btn-gold btn-sm" onclick="openItemModal()">+ New item</button>
  </div>
</header>
<div class="wrap">
  <div class="stats-row">
    <div class="stat-cell"><div class="stat-lbl">SKUs tracked</div><div class="stat-val" id="stC">--</div></div>
    <div class="stat-cell"><div class="stat-lbl">Stock value</div><div class="stat-val gold" id="stV">--</div></div>
    <div class="stat-cell"><div class="stat-lbl">Low stock</div><div class="stat-val red" id="stL">--</div></div>
    <div class="stat-cell"><div class="stat-lbl">Out of stock</div><div class="stat-val red" id="stO">--</div></div>
  </div>
  <div id="alertZone"></div>
  <div class="toolbar">
    <input class="search-input" id="search" placeholder="Search material, SKU, supplier..." oninput="renderList()">
    <div class="filter-tabs">
      <button class="ftab active" data-f="all" onclick="setF('all')">All</button>
      <button class="ftab" data-f="steel" onclick="setF('steel')">Steel</button>
      <button class="ftab" data-f="paint" onclick="setF('paint')">Paint</button>
      <button class="ftab" data-f="consumable" onclick="setF('consumable')">Consumables</button>
      <button class="ftab" data-f="hardware" onclick="setF('hardware')">Hardware</button>
      <button class="ftab" data-f="low" onclick="setF('low')">Low stock</button>
    </div>
  </div>
  <div id="listBody"><div class="loading">Loading...</div></div>
</div>

<div class="overlay" id="itemOverlay">
  <div class="modal">
    <h2 id="mTitle">New item</h2>
    <input type="hidden" id="mId">
    <div class="field"><label>Material name</label><input id="mName" placeholder="MS Plate 10mm"></div>
    <div class="f2">
      <div class="field"><label>SKU</label><input id="mSku" placeholder="auto if blank"></div>
      <div class="field"><label>Category</label><select id="mCat"><option value="steel">Steel (plates/tubes/rods)</option><option value="stainless">Stainless steel</option><option value="aluminum">Aluminum</option><option value="welding">Welding materials</option><option value="paint">Paint &amp; coating</option><option value="consumable">Consumables</option><option value="hardware">Hardware &amp; fixings</option><option value="glass">Glass</option><option value="wood">Wood</option><option value="other">Other</option></select></div>
    </div>
    <div class="f2">
      <div class="field"><label>Qty in stock</label><input id="mQty" type="number" min="0" step="any" placeholder="0"></div>
      <div class="field"><label>Unit</label><select id="mUnit"><option>kg</option><option>ton</option><option>pcs</option><option>m</option><option>m2</option><option>litre</option><option>sheet</option><option>roll</option></select></div>
    </div>
    <div class="f2">
      <div class="field"><label>Reorder level</label><input id="mReorder" type="number" min="0" step="any" placeholder="50"></div>
      <div class="field"><label>Unit cost (SAR)</label><input id="mCost" type="number" min="0" step="any" placeholder="0"></div>
    </div>
    <div class="field"><label>Supplier</label><input id="mSupplier" placeholder="optional"></div>
    <div class="f2">
      <div class="field"><label>Location</label><input id="mLocation" placeholder="e.g. Rack A3, Yard, Store"></div>
      <div class="field"><label>Notes</label><input id="mNotes" placeholder="spec, grade, notes"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger btn-sm mfl" id="mDel" style="display:none" onclick="deleteItem()">Delete</button>
      <button class="btn btn-sm" onclick="closeModals()">Cancel</button>
      <button class="btn btn-gold btn-sm" onclick="saveItem()">Save</button>
    </div>
  </div>
</div>

<div class="overlay" id="adjOverlay">
  <div class="modal">
    <h2 id="adjTitle">Adjust stock</h2>
    <div class="field"><label>Movement</label><select id="adjType"><option value="in">Stock in (+)</option><option value="out">Stock out (&#8722;)</option><option value="set">Set exact count</option></select></div>
    <div class="field"><label>Quantity</label><input id="adjQty" type="number" min="0" step="any" placeholder="0"></div>
    <div class="field"><label>Note</label><input id="adjNote" placeholder="e.g. Used on project APM-Q-2026-004"></div>
    <div class="modal-foot">
      <button class="btn btn-sm" onclick="closeModals()">Cancel</button>
      <button class="btn btn-gold btn-sm" onclick="applyAdj()">Apply</button>
    </div>
  </div>
</div>

<div id="toasts"></div>
<script>
const SB_URL='https://spfztpokbpomqtiqgggz.supabase.co';
const SB_KEY='sb_publishable_xPXU0xL_YaiWA6k9PWc0Xg_4QYeypNi';
const sb=supabase.createClient(SB_URL,SB_KEY);
const CATS={steel:{label:'Steel',color:'#888888'},paint:{label:'Paint',color:'#A8874E'},consumable:{label:'Consumable',color:'#C8A96E'},hardware:{label:'Hardware',color:'#444444'},other:{label:'Other',color:'#AAAAAA'}};
let items=[],sfilt='all',adjTarget=null;
const $=id=>document.getElementById(id);
const esc=s=>(s??'').toString().replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const fmtSAR0=n=>'SAR '+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
const fmtQ=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const isLow=i=>Number(i.qty)<=Number(i.reorder_level||0)&&Number(i.reorder_level||0)>0;
const isOut=i=>Number(i.qty)<=0;

function toggleTheme(){const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('apm_theme',n);}
function toast(m,e){const t=document.createElement('div');t.className='toast'+(e?' err':'');t.textContent=m;$('toasts').appendChild(t);setTimeout(()=>t.remove(),3800);}

async function loadAll(){
  const{data,error}=await sb.from('inventory').select('*').order('name');
  if(error){$('listBody').innerHTML='<div class="tbl-wrap"><div class="empty"><strong>Could not load</strong>Run erp_setup_all.sql and fix_permissions.sql in Supabase.</div></div>';toast(error.message,1);return;}
  items=data;renderAll();
}
function renderAll(){renderStats();renderAlerts();renderList();}
function renderStats(){
  $('stC').textContent=items.length;
  $('stV').textContent=fmtSAR0(items.reduce((s,i)=>s+Number(i.qty||0)*Number(i.unit_cost||0),0));
  $('stL').textContent=items.filter(isLow).length;
  $('stO').textContent=items.filter(isOut).length;
}
function renderAlerts(){
  const low=items.filter(isLow);
  $('alertZone').innerHTML=low.length?`<div class="alertbar"><strong>${low.length} item${low.length>1?'s':''} at or below reorder level:</strong> ${low.slice(0,5).map(i=>esc(i.name)).join(', ')}${low.length>5?'...':''}</div>`:'';
}
function setF(f){sfilt=f;document.querySelectorAll('.ftab').forEach(t=>t.classList.toggle('active',t.dataset.f===f));renderList();}
function renderList(){
  let list=items.slice();
  if(sfilt==='low')list=list.filter(isLow);
  else if(sfilt!=='all')list=list.filter(i=>i.category===sfilt);
  const term=$('search').value.trim().toLowerCase();
  if(term)list=list.filter(i=>[i.name,i.sku,i.supplier].some(v=>(v||'').toLowerCase().includes(term)));
  if(!list.length){$('listBody').innerHTML='<div class="tbl-wrap"><div class="empty"><strong>Nothing here</strong>Add raw materials, paint, consumables and hardware to track stock.</div></div>';return;}
  const rows=list.map(i=>{
    const c=CATS[i.category]||CATS.other,low=isLow(i),out=isOut(i);
    const sc=out?'#C0392B':low?'#A8874E':'#2D7D46';
    return`<tr class="rc ${low?'low-row':''}" onclick="openItemModal('${i.id}')">
      <td><strong>${esc(i.name)}</strong><div class="dim">${esc(i.sku||'')}</div></td>
      <td><span class="badge" style="color:${c.color};border-color:${c.color}44">${c.label}</span></td>
      <td><span style="color:${sc};font-weight:600;font-variant-numeric:tabular-nums">${fmtQ(i.qty)}</span> <span class="dim">${esc(i.unit)}</span></td>
      <td class="mono dim">${i.reorder_level?fmtQ(i.reorder_level)+' '+esc(i.unit):'--'}</td>
      <td class="mono">${fmtSAR0(Number(i.qty||0)*Number(i.unit_cost||0))}</td>
      <td class="dim">${esc(i.supplier||'--')}</td>
      <td><div style="display:flex;gap:4px;justify-content:flex-end">
        <button class="qbtn" title="Stock out" onclick="event.stopPropagation();quickAdj('${i.id}','out')">-</button>
        <button class="qbtn" title="Stock in" onclick="event.stopPropagation();quickAdj('${i.id}','in')">+</button>
      </div></td>
    </tr>`;
  }).join('');
  $('listBody').innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>Material</th><th>Category</th><th>In stock</th><th>Reorder at</th><th>Value</th><th>Supplier</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function nextSku(cat){
  const p=(cat||'OTH').slice(0,3).toUpperCase()+'-';
  const nums=items.map(i=>i.sku).filter(s=>s&&s.startsWith(p)).map(s=>parseInt(s.slice(p.length),10)).filter(n=>!isNaN(n));
  return p+String((nums.length?Math.max(...nums):0)+1).padStart(3,'0');
}
function openItemModal(id){
  const it=id?items.find(x=>x.id===id):null;
  $('mId').value=it?.id||'';$('mTitle').textContent=it?'Edit item':'New item';
  $('mName').value=it?.name||'';$('mSku').value=it?.sku||'';$('mCat').value=it?.category||'steel';
  $('mQty').value=it?Number(it.qty):'';$('mUnit').value=it?.unit||'kg';
  $('mReorder').value=it?.reorder_level??'';$('mCost').value=it?.unit_cost??'';$('mSupplier').value=it?.supplier||'';
  $('mDel').style.display=it?'':'none';
  $('itemOverlay').classList.add('open');$('mName').focus();
}
async function saveItem(){
  const name=$('mName').value.trim();if(!name)return toast('Material name required',1);
  const cat=$('mCat').value;
  const rec={name,sku:$('mSku').value.trim()||nextSku(cat),category:cat,qty:Number($('mQty').value||0),unit:$('mUnit').value,reorder_level:Number($('mReorder').value||0),unit_cost:Number($('mCost').value||0),supplier:$('mSupplier').value.trim()||null,location:$('mLocation').value.trim()||null,notes:$('mNotes').value.trim()||null};
  const id=$('mId').value;
  const{error}=await(id?sb.from('inventory').update(rec).eq('id',id):sb.from('inventory').insert(rec));
  if(error)return toast(error.message,1);
  closeModals();toast(id?'Item updated':'Item added');loadAll();
}
async function deleteItem(){
  const id=$('mId').value;if(!id||!confirm('Delete this item?'))return;
  const{error}=await sb.from('inventory').delete().eq('id',id);
  if(error)return toast(error.message,1);
  closeModals();toast('Deleted');loadAll();
}
function quickAdj(id,type){adjTarget=items.find(i=>i.id===id);if(!adjTarget)return;$('adjTitle').textContent=(type==='in'?'Stock in':'Stock out')+' -- '+adjTarget.name;$('adjType').value=type;$('adjQty').value='';$('adjNote').value='';$('adjOverlay').classList.add('open');$('adjQty').focus();}
async function applyAdj(){
  const type=$('adjType').value,q=Number($('adjQty').value||0);
  if(q<=0&&type!=='set')return toast('Enter a quantity',1);
  let nq=Number(adjTarget.qty||0);
  if(type==='in')nq+=q;else if(type==='out')nq=Math.max(0,nq-q);else nq=q;
  const{error}=await sb.from('inventory').update({qty:nq}).eq('id',adjTarget.id);
  if(error)return toast(error.message,1);
  adjTarget.qty=nq;closeModals();renderAll();toast('Stock updated');
}

// Enter key in modals
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  var t=e.target;
  if(t.id==='mName'||t.id==='mSupplier')saveItem();
  if(t.id==='adjQty')applyAdj();
});
function closeModals(){document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('open'));}
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeModals();}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModals();});
loadAll();
</script>
</body>
</html>
