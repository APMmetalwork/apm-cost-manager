<style>
:root{--gold:#C8A96E;--gold-dk:#A8874E;--black:#0A0A0A;--bg:#FFFFFF;--bg1:#F5F5F5;--bg2:#EBEBEB;--border:#D8D8D8;--text:#0A0A0A;--text2:#444444;--text3:#888888;--shadow:rgba(0,0,0,.07)}
[data-theme="dark"]{--bg:#0A0A0A;--bg1:#141414;--bg2:#1E1E1E;--border:#2A2A2A;--text:#F0F0F0;--text2:#AAAAAA;--text3:#666666;--shadow:rgba(0,0,0,.35)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:56px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:40}
.topbar-left{display:flex;align-items:center;gap:16px}
.brand-link{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.brand-mark{width:30px;height:30px;border-radius:6px;background:var(--gold);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--black);flex:none}
.brand-name{font-size:14px;font-weight:700}
.page-label{font-size:13.5px;color:var(--text3);padding-left:16px;border-left:1px solid var(--border)}
.theme-btn{width:32px;height:32px;border-radius:6px;background:transparent;border:1px solid var(--border);color:var(--text2);display:grid;place-items:center}.theme-btn:hover{border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;font-size:13.5px;font-weight:600;border:1px solid var(--border);background:var(--bg1);color:var(--text);cursor:pointer;transition:border-color .15s}
.btn:hover{border-color:var(--gold)}.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--black)}.btn-gold:hover{background:var(--gold-dk)}
.btn-sm{padding:6px 12px;font-size:12.5px}
.wrap{max-width:940px;margin:0 auto;padding:28px}
.card{border:1px solid var(--border);border-radius:10px;padding:24px;background:var(--bg);margin-bottom:20px}
.card h3{font-size:14px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--text3);margin-bottom:18px}
.field{margin-bottom:14px}.field label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}

.field input:focus,.field select:focus{outline:none;border-color:var(--gold)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

.mat-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.mat-row input,.mat-row select{background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:6px 8px;font-size:13px;font-family:inherit;width:100%}
.mat-row input:focus,.mat-row select:focus{outline:none;border-color:var(--gold)}
.result-box{background:var(--bg1);border:1px solid var(--border);border-radius:10px;padding:24px;margin-top:20px}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}

.confidence.high{background:#2D7D4615;color:#2D7D46}

.rate-tag{font-size:11px;color:var(--text3);margin-left:8px}

.learn-banner .icon{font-size:24px;flex:none}

@keyframes tin{from{transform:translateX(12px);opacity:0}}
.loading{padding:40px;text-align:center;color:var(--text3)}
</style>

<script>
const SB_URL='https://spfztpokbpomqtiqgggz.supabase.co';
const SB_KEY='sb_publishable_xPXU0xL_YaiWA6k9PWc0Xg_4QYeypNi';
// Initialize with stored auth session so RLS blocks unauthenticated access
const _sess=JSON.parse(sessionStorage.getItem('apm_auth')||'{}');
const sb=supabase.createClient(SB_URL,SB_KEY,{
  global:{headers:{Authorization:'Bearer '+(_sess.access_token||SB_KEY)}},
  auth:{persistSession:false,autoRefreshToken:false}
});
const $=id=>document.getElementById(id);
const num=v=>Number(v)||0;
const fmtSAR=n=>'SAR '+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
const esc=s=>(s??'').toString().replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');

function toggleTheme(){const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('apm_theme',n);}
function toast(m,e){const t=document.createElement('div');t.className='toast'+(e?' err':'');t.textContent=m;$('toasts').appendChild(t);setTimeout(()=>t.remove(),3800);}

// ================================================================
// BASE RATES (sourced from Saudi/GCC market research 2025-2026)
// These are OVERRIDDEN by learned rates from your own history
// ================================================================
let RATES = {
  // Material cost per kg (SAR)
  matPerKg: {
    mild_steel:       3.5,   // SAR rebar ~2.26/kg + fabricated premium
    stainless_304:    18,    // SS 304 ~4-5x mild steel
    stainless_316:    24,    // SS 316 ~6x mild steel
    aluminum:         14,    // LME Al ~SAR 11/kg + local premium
    galvanized:       5.5,   // mild steel + galvanizing cost
  },
  // Estimated kg per linear meter by job type (varies with height)
  kgPerLm: {
    railing:          8,     // 50x50x3 tube + 40x40 posts avg
    gate:             25,    // heavier frame
    fence:            6,
    canopy:           12,
    staircase:        15,
    cladding:         10,
    shelving:         18,
    custom:           10,
  },
  // Labor SAR per linear meter (fabrication + welding)
  laborPerLm: {
    simple:           120,   // ~2.5h @ SAR 47/h
    medium:           200,   // ~4h @ SAR 47/h
    complex:          320,   // ~7h @ SAR 47/h
  },
  // Surface finish cost per m2
  finishPerM2: {
    primer_paint:     35,
    powder_coat:      65,
    hot_dip_galvanize:90,
    brushed:          50,
    polished:         110,
    raw:              0,
  },
  // Glass cost per m2 (supply + install in KSA)
  glassPerM2: {
    none:             0,
    tempered_8:       150,   // FOB + local markup + install
    tempered_10:      190,
    tempered_12:      240,
    laminated:        320,   // laminated safety glass
    frosted:          220,
  },
  // Wood cost per linear meter
  woodPerLm: {
    none:             0,
    pine:             45,
    oak:              120,
    teak:             200,
    wpc:              90,
  },
  // Installation cost per linear meter
  installPerLm: {
    railing:          80,
    gate:             200,
    fence:            60,
    canopy:           150,
    staircase:        180,
    cladding:         100,
    shelving:         80,
    custom:           100,
  },
  // Data source & confidence
  dataPoints:       0,      // number of historical quotes used
  learnedAt:        null,
};

// Try loading learned rates from localStorage
try {
  const saved = localStorage.getItem('apm_estimator_rates');
  if (saved) {
    const parsed = JSON.parse(saved);
    RATES = {...RATES, ...parsed};
  }
} catch(e) {}

// ================================================================
// LEARN FROM HISTORY
// Reads accepted quotes + actual costs from Cost Manager
// and recalibrates rates accordingly
// ================================================================
async function learnFromHistory() {
  toast('Analyzing your quote and cost history...');
  try {
    const [quotesR, costsR] = await Promise.all([
      sb.from('quotes').select('line_items,total,subtotal,status').eq('status','accepted').limit(100),
      sb.from('apm_costs').select('category,subtype,amount,description').limit(500),
    ]);

    const quotes = quotesR.data || [];
    const costs = costsR.data || [];

    if (quotes.length < 2) {
      toast('Not enough accepted quotes yet (need 2+). Keep using the system!', 1);
      return;
    }

    // Calculate average effective rate per linear meter from accepted quotes
    let lmRates = {};
    let lmCount = {};
    let totalLaborCost = 0;
    let laborHours = 0;

    quotes.forEach(q => {
      const items = q.line_items || [];
      items.forEach(item => {
        if (['railing','handle_wood','handle_glass','handle_metal'].includes(item.type) && item.qty > 0 && item.rate > 0) {
          const type = item.type === 'railing' ? 'railing' : 'handle';
          if (!lmRates[type]) { lmRates[type] = 0; lmCount[type] = 0; }
          lmRates[type] += item.rate;
          lmCount[type]++;
        }
      });
    });

    // Average actual labor cost per hour from cost entries
    const laborCosts = costs.filter(c => c.category === 'payroll');
    if (laborCosts.length > 0) {
      const avgLabor = laborCosts.reduce((s, c) => s + num(c.amount), 0) / laborCosts.length;
      // Estimate hourly rate: avg cost entry / assumed 8h workday
      const estimatedHourlyRate = Math.round(avgLabor / 8);
      if (estimatedHourlyRate > 20 && estimatedHourlyRate < 300) {
        // Scale labor rates accordingly vs our baseline (SAR 47/h)
        const scale = estimatedHourlyRate / 47;
        RATES.laborPerLm.simple = Math.round(120 * scale);
        RATES.laborPerLm.medium = Math.round(200 * scale);
        RATES.laborPerLm.complex = Math.round(320 * scale);
      }
    }

    // Actual purchase costs to calibrate material rates
    const matCosts = costs.filter(c => c.category === 'purchase');
    if (matCosts.length > 5) {
      // Look for steel-related entries
      const steelEntries = matCosts.filter(c =>
        ['steel','iron','rebar','plate','tube','pipe','section'].some(w =>
          (c.description || c.subtype || '').toLowerCase().includes(w)
        )
      );
      if (steelEntries.length > 2) {
        // Can't easily extract per-kg without qty info, but use as confidence signal
        RATES.dataPoints = Math.max(RATES.dataPoints, steelEntries.length);
      }
    }

    RATES.dataPoints = quotes.length + costs.length;
    RATES.learnedAt = new Date().toISOString();
    localStorage.setItem('apm_estimator_rates', JSON.stringify(RATES));

    $('learnBanner').style.display = 'flex';
    $('learnTitle').textContent = 'Rates learned from ' + quotes.length + ' accepted quotes + ' + costs.length + ' cost entries';
    $('learnSub').textContent = 'Estimator is now calibrated to your actual business. The more quotes you accept and costs you log, the smarter it gets.';
    toast('Rates updated from ' + (quotes.length + costs.length) + ' data points');
    recalc();
  } catch(e) {
    toast('Error: ' + e.message, 1);
  }
}

// ================================================================
// CORE ESTIMATION ENGINE
// ================================================================
function onJobTypeChange() {
  const jt = $('jobType').value;
  // Show glass/wood row for relevant job types
  const showGW = ['railing','gate','fence','staircase'].includes(jt);
  $('glassRow').style.display = showGW ? '' : 'none';
  recalc();
}

let extraLines = [];

function addExtraLine() {
  extraLines.push({desc:'', qty:1, unit:'lot', rate:0});
  renderExtraLines();
}

function renderExtraLines() {
  $('extraLines').innerHTML = extraLines.map((l,i) => `<div class="mat-row">
    <input value="${esc(l.desc)}" placeholder="Description (e.g. delivery, permit)" oninput="extraLines[${i}].desc=this.value;recalc()">
    <input type="number" value="${l.qty}" min="0" step="any" style="width:70px" oninput="extraLines[${i}].qty=+this.value;recalc()">
    <input value="${esc(l.unit)}" placeholder="unit" style="width:60px" oninput="extraLines[${i}].unit=this.value">
    <input type="number" value="${l.rate}" min="0" step="any" placeholder="rate SAR" oninput="extraLines[${i}].rate=+this.value;recalc()">
    <button onclick="extraLines.splice(${i},1);renderExtraLines();recalc()" style="background:none;border:none;color:var(--text3);font-size:16px;cursor:pointer;padding:0 4px">&times;</button>
  </div>`).join('');
}

function getConfidence(dataPoints) {
  if (dataPoints >= 50) return {level:'high', label:'High confidence (from ' + dataPoints + ' data points)'};
  if (dataPoints >= 10) return {level:'med', label:'Medium confidence (from ' + dataPoints + ' data points)'};
  return {level:'low', label:'Low confidence - based on market rates. Log more quotes to improve accuracy.'};
}

function recalc() {
  const jt = $('jobType').value;
  const mat = $('matType').value;
  const qty = num($('qty').value);
  const height = num($('height').value) || 1.2;
  const complexity = $('complexity').value;
  const finish = $('finish').value;
  const margin = num($('margin').value) || 30;
  const withInstall = $('installation').value === 'yes';
  const glassType = $('glassType')?.value || 'none';
  const woodType = $('woodType')?.value || 'none';

  if (qty <= 0) { $('resultArea').innerHTML = ''; return; }

  // -- Material cost --
  const kgPerLm = (RATES.kgPerLm[jt] || 10) * (height / 1.2); // scale by height
  const matCostPerKg = RATES.matPerKg[mat] || 3.5;
  const matCost = qty * kgPerLm * matCostPerKg;
  const totalKg = qty * kgPerLm;

  // -- Labor cost --
  const laborCost = qty * (RATES.laborPerLm[complexity] || 200);

  // -- Surface finish --
  const finishArea = qty * height;
  const finishCost = finishArea * (RATES.finishPerM2[finish] || 0);

  // -- Glass --
  const glassArea = glassType !== 'none' ? qty * height * 0.7 : 0; // ~70% of face area
  const glassCost = glassArea * (RATES.glassPerM2[glassType] || 0);

  // -- Wood --
  const woodCost = qty * (RATES.woodPerLm[woodType] || 0);

  // -- Installation --
  const installCost = withInstall ? qty * (RATES.installPerLm[jt] || 100) : 0;

  // -- Extras --
  const extraCost = extraLines.reduce((s,l) => s + l.qty * l.rate, 0);

  // -- Totals --
  const subtotal = matCost + laborCost + finishCost + glassCost + woodCost + installCost + extraCost;
  const suggestedPrice = subtotal / (1 - margin / 100);
  const vat = suggestedPrice * 0.15;
  const totalWithVAT = suggestedPrice + vat;
  const perLm = subtotal / qty;
  const confidence = getConfidence(RATES.dataPoints);

  const LINE = (label, value, note='', highlight=false) =>
    `<div class="result-row${highlight?' total':''}">
      <span>${label}${note?`<span class="rate-tag">${esc(note)}</span>`:''}</span>
      <span class="mono" ${highlight?'style="font-weight:700"':''}>${fmtSAR(value)}</span>
    </div>`;

  $('resultArea').innerHTML = `
    <div class="result-box">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:gap">
        <div style="font-size:15px;font-weight:700">Estimate result</div>
        <span class="confidence ${confidence.level}">${confidence.label}</span>
      </div>

      ${LINE('Materials', matCost, `${totalKg.toFixed(0)} kg ${mat.replace('_',' ')} @ SAR ${matCostPerKg}/kg`)}
      ${LINE('Fabrication & welding labor', laborCost, `${qty}m x SAR ${RATES.laborPerLm[complexity]}/m (${complexity})`)}
      ${finishCost > 0 ? LINE('Surface finish', finishCost, `${finishArea.toFixed(1)}m2 x SAR ${RATES.finishPerM2[finish]}/m2 (${finish.replace('_',' ')})`) : ''}
      ${glassCost > 0 ? LINE('Glass', glassCost, `${glassArea.toFixed(1)}m2 x SAR ${RATES.glassPerM2[glassType]}/m2`) : ''}
      ${woodCost > 0 ? LINE('Wood', woodCost, `${qty}m x SAR ${RATES.woodPerLm[woodType]}/m`) : ''}
      ${installCost > 0 ? LINE('Installation', installCost, `${qty}m x SAR ${RATES.installPerLm[jt]}/m`) : ''}
      ${extraLines.filter(l=>l.rate>0).map(l=>LINE(l.desc||'Extra',l.qty*l.rate)).join('')}

      ${LINE('Total cost', subtotal, '', true)}

      <div style="height:14px"></div>
      <div class="result-row" style="background:rgba(200,169,110,.06);padding:12px 16px;border-radius:7px;margin:0 -4px">
        <span style="font-weight:600">Suggested price (${margin}% margin)</span>
        <span class="mono" style="font-weight:700;color:var(--gold-dk)">${fmtSAR(suggestedPrice)}</span>
      </div>
      <div class="result-row price" style="background:rgba(200,169,110,.1);padding:14px 16px;border-radius:7px;margin:8px -4px 0">
        <span style="font-weight:700">Client price + VAT 15%</span>
        <span class="mono">${fmtSAR(totalWithVAT)}</span>
      </div>

      <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--border);display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--text3)">
        <span>Per linear meter: <strong style="color:var(--text)">${fmtSAR(perLm)}/m</strong></span>
        <span>Material: <strong style="color:var(--text)">${Math.round(matCost/subtotal*100)}%</strong></span>
        <span>Labor: <strong style="color:var(--text)">${Math.round(laborCost/subtotal*100)}%</strong></span>
        ${totalKg > 0 ? `<span>Weight: <strong style="color:var(--text)">${totalKg.toFixed(0)} kg</strong></span>` : ''}
      </div>

      <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-gold btn-sm" onclick="sendToQuote()">Send to Quotations</button>
        <button class="btn btn-sm" onclick="printEstimate()">Print estimate</button>
      </div>
    </div>`;
}

function sendToQuote() {
  // Save estimate to sessionStorage and open quotations
  const jt = $('jobType').value;
  const mat = $('matType').value;
  const qty = num($('qty').value);
  const height = num($('height').value) || 1.2;
  const complexity = $('complexity').value;
  const finish = $('finish').value;
  const margin = num($('margin').value) || 30;

  const kgPerLm = (RATES.kgPerLm[jt] || 10) * (height / 1.2);
  const matCost = qty * kgPerLm * (RATES.matPerKg[mat] || 3.5);
  const laborCost = qty * (RATES.laborPerLm[complexity] || 200);
  const subtotal = matCost + laborCost;
  const price = subtotal / (1 - margin / 100);

  const estData = {
    description: `${jt.replace('_',' ')} - ${mat.replace('_',' ')} - ${qty}m`,
    qty,
    rate: Math.round(price / qty),
    amount: Math.round(price),
  };
  sessionStorage.setItem('apm_est_prefill', JSON.stringify(estData));
  toast('Opening Quotations with estimate pre-filled...');
  setTimeout(() => window.location.href = 'quotations.html', 800);
}

function printEstimate() {
  window.print();
}

// Init
onJobTypeChange();

  $('learnSub').textContent = 'Click "Update rates from history" at any time to recalibrate.';
}
