<script>
(function(){
  var K='apm_auth',T=10*60*60*1000;
  try{var s=JSON.parse(sessionStorage.getItem(K));if(!s||Date.now()-s.ts>T)throw 0;}
  catch(e){window.location.href='login.html';return;}
  document.addEventListener('DOMContentLoaded',function(){
    document.body.style.display='none';
    var gate=document.createElement('div');gate.id='mod-gate';
    gate.innerHTML='<style>'
      +'#mod-gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;'
      +'background:var(--bg,#fff);z-index:9999;font-family:inherit}'
      +'#mod-gate .gc{width:100%;max-width:360px;padding:24px;border:1px solid var(--border,#d8d8d8);'
      +'border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.08)}'
      +'#mod-gate h2{font-size:17px;font-weight:700;margin-bottom:4px}'
      +'#mod-gate p{font-size:13px;color:var(--text3,#888);margin-bottom:20px}'
      +'#mod-gate label{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;'
      +'text-transform:uppercase;color:var(--text3,#888);margin-bottom:7px}'
      +'#mod-gate input{width:100%;padding:11px 13px;border:1px solid var(--border,#d8d8d8);'
      +'border-radius:6px;background:var(--bg1,#f5f5f5);color:var(--text,#0a0a0a);'
      +'font-size:14px;font-family:inherit;box-sizing:border-box}'
      +'#mod-gate input:focus{outline:none;border-color:#C8A96E}'
      +'#mod-gate input.err{border-color:#C0392B}'
      +'#mod-gate .errmsg{display:none;color:#C0392B;font-size:12.5px;margin-top:8px}'
      +'#mod-gate .errmsg.show{display:block}'
      +'#mod-gate button{width:100%;margin-top:14px;padding:11px;background:#C8A96E;'
      +'border:none;border-radius:6px;color:#0a0a0a;font-size:14px;font-weight:700;cursor:pointer}'
      +'#mod-gate button:hover{background:#A8874E}'
      +'#mod-gate button:disabled{opacity:.6;cursor:not-allowed}'
      +'</style>'
      +'<div class="gc"><h2>Cost Manager</h2>'
      +'<p>Enter the module password to continue.</p>'
      +'<label>Password</label>'
      +'<input id="mgpw" type="password" placeholder="Password" />'
      +'<div class="errmsg" id="mgerr">Incorrect password.</div>'
      +'<button id="mgbtn" onclick="mgCheck()">Open</button></div>';
    document.body.parentNode.insertBefore(gate,document.body);
    document.getElementById('mgpw').addEventListener('keydown',function(e){
      if(e.key==='Enter'){e.preventDefault();mgCheck();}
    });
    document.getElementById('mgpw').addEventListener('input',function(){
      document.getElementById('mgerr').classList.remove('show');
      document.getElementById('mgpw').classList.remove('err');
    });
    setTimeout(function(){document.getElementById('mgpw').focus();},80);
  });
  window.mgCheck=function(){
    var pw=document.getElementById('mgpw').value;
    var btn=document.getElementById('mgbtn');
    btn.disabled=true;btn.textContent='Checking...';
    fetch('https://spfztpokbpomqtiqgggz.supabase.co/rest/v1/apm_settings?key=eq.mod_pass_costmanager&select=value',{
      headers:{'apikey':'sb_publishable_xPXU0xL_YaiWA6k9PWc0Xg_4QYeypNi','Authorization':'Bearer sb_publishable_xPXU0xL_YaiWA6k9PWc0Xg_4QYeypNi'}
    })
    .then(function(r){return r.json();})
    .then(function(d){
      var correct=d&&d[0]&&d[0].value;
      if(correct&&pw===correct){
        document.getElementById('mod-gate').remove();
        document.body.style.display='';
      }else{
        document.getElementById('mgerr').classList.add('show');
        document.getElementById('mgpw').classList.add('err');
        document.getElementById('mgpw').value='';
        document.getElementById('mgpw').focus();
        btn.disabled=false;btn.textContent='Open';
      }
    })
    .catch(function(){
      document.getElementById('mgerr').textContent='Could not connect. Check your internet.';
      document.getElementById('mgerr').classList.add('show');
      btn.disabled=false;btn.textContent='Open';
    });
  };
})();
(function(){var t=localStorage.getItem('apm_theme')||'light';document.documentElement.setAttribute('data-theme',t);})();
</script>

<script>
const SB_URL='https://spfztpokbpomqtiqgggz.supabase.co';
const SB_KEY='sb_publishable_xPXU0xL_YaiWA6k9PWc0Xg_4QYeypNi';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=s=>(s??'').toString().replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const fmtSAR=n=>'SAR '+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
const fmtSAR2=n=>'SAR '+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'-';
const today=()=>new Date().toISOString().slice(0,10);
const num=v=>Number(v||0);

let projects=[],curProj=null,boq=[],costs=[],prs=[],suppliers=[],audit=[],view='home';
let allCosts=[],allBoq=[];
// Live FX rates (SAR base). Updated on load via open API.
let FX={SAR:1,AED:1.02,USD:3.75,EUR:4.05,GBP:4.73};
async function loadFX(){
  try{
    const r=await fetch('https://open.er-api.com/v6/latest/SAR');
    if(!r.ok)return;
    const d=await r.json();
    if(d.rates){
      FX.USD=d.rates.USD?1/d.rates.USD*FX.SAR:FX.USD;
      FX.AED=d.rates.AED?1/d.rates.AED*FX.SAR:FX.AED;
      FX.EUR=d.rates.EUR?1/d.rates.EUR*FX.SAR:FX.EUR;
      FX.GBP=d.rates.GBP?1/d.rates.GBP*FX.SAR:FX.GBP;
    }
  }catch(e){}
}

const CAT={
  purchase:{label:'Purchases',budget:'budget_purchases',subs:['cash','transfer','credit']},
  payroll:{label:'Payroll',budget:'budget_payroll',subs:['salary','overtime','medical','termination']},
  direct:{label:'Direct',budget:'budget_direct',subs:['commission','engineering','food','transportation']},
  indirect:{label:'Indirect',budget:'budget_indirect',subs:['electricity','water','rent']},
  goci:{label:'GOCI',budget:'budget_goci',subs:['government_fees','permits','official_papers']},
};

function toggleTheme(){const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('apm_theme',n);}
function toast(m,e){const t=document.createElement('div');t.className='toast'+(e?' err':'');t.textContent=m;$('toasts').appendChild(t);setTimeout(()=>t.remove(),3800);}

async function logAudit(action,detail){
  try{await sb.from('apm_audit').insert({project_id:curProj?.id||null,action,detail,actor:'user'});}catch(e){}
}

async function loadProjects(){
  const{data,error}=await sb.from('apm_projects').select('*').order('created_at',{ascending:false});
  if(error){$('content').innerHTML='<div class="tbl-wrap"><div class="empty"><strong>Could not load</strong>Run costmanager_setup.sql in Supabase, then refresh.</div></div>';toast(error.message,
    1);return;}
  projects=data||[];
  if(!projects.length){renderNoProjects();return;}
  $('projSel').innerHTML=projects.map(p=>`<option value="${p.id}">${esc(p.name)}${p.client?' - '+esc(p.client):''}</option>`).join('');
  const keep=curProj&&projects.find(p=>p.id===curProj.id);
  curProj=keep||projects[0];
  $('projSel').value=curProj.id;
  await loadProjectData();
}
function renderNoProjects(){
  $('projSel').innerHTML='<option>No projects</option>';
  $('content').innerHTML='<div class="tbl-wrap"><div class="empty"><strong>No projects yet</strong>Create your first project with the wizard - set budgets and approval tiers in one go.</div></div>';
}
async function selectProject(id){curProj=projects.find(p=>p.id===id);if(curProj){$('projStatus').value=curProj.status||'active';await loadProjectData();}}
async function updateProjStatus(status){
  if(!curProj)return;
  const{error}=await sb.from('apm_projects').update({status}).eq('id',curProj.id);
  if(error)return toast(error.message,1);
  curProj.status=status;logAudit('status_change','Project set to '+status);toast('Status updated');
}

async function loadProjectData(){
  if(!curProj)return;
  $('projStatus').value=curProj.status||'active';
  $('content').innerHTML='<div class="loading">Loading&#8230;</div>';
  const[bR,cR,pR,sR,aR]=await Promise.all([
    sb.from('apm_boq').select('*').eq('project_id',curProj.id).order('created_at'),
    sb.from('apm_costs').select('*').eq('project_id',curProj.id).order('cost_date',{ascending:false}),
    sb.from('apm_purchase_requests').select('*').eq('project_id',curProj.id).order('created_at',{ascending:false}),
    sb.from('apm_suppliers').select('*').order('name'),
    sb.from('apm_audit').select('*').eq('project_id',curProj.id).order('created_at',{ascending:false}).limit(200),
  ]);
  boq=bR.data||[];costs=cR.data||[];prs=pR.data||[];suppliers=sR.data||[];audit=aR.data||[];
  renderAlerts();render();
}

// &#9472;&#9472; Derived totals &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;
const boqTotal=()=>boq.reduce((s,b)=>s+num(b.amount),0);
const costByCat=cat=>costs.filter(c=>c.category===cat).reduce((s,c)=>s+num(c.amount),0);
const totalCost=()=>costs.reduce((s,c)=>s+num(c.amount),0);
const budgetByCat=cat=>num(curProj?.[CAT[cat].budget]);
const totalBudget=()=>Object.keys(CAT).reduce((s,k)=>s+budgetByCat(k),0);

function renderAlerts(){
  const al=[];
  Object.keys(CAT).forEach(k=>{
    const b=budgetByCat(k),a=costByCat(k);
    if(b>0&&a>b)al.push(`${CAT[k].label} over budget by ${fmtSAR(a-b)}`);
  });
  const pend=prs.filter(p=>p.status==='pending'||p.status==='approved_t1'||p.status==='approved_t2').length;
  let h='';
  if(al.length)h+=`<div class="alertbar"><strong>Cost alert:</strong> ${al.join(' . ')}</div>`;
  if(pend)h+=`<div class="alertbar" style="border-color:#C8A96E44;background:#FBF6EC;color:#8A6A28">${pend} purchase request${pend>1?'s':''} pending approval</div>`;
  $('alertZone').innerHTML=h;
}

function switchView(v){
  view=v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.v===v));
  // Home screen doesn't need a loaded project
  if(v==='home'){render();return;}
  if(!curProj){render();return;}
  render();
}
function render(){
  if(view==='home'){renderHome();return;}
  if(!curProj){$('content').innerHTML='<div class="tbl-wrap"><div class="empty"><strong>No project selected</strong>Create a project first.</div></div>';return;}
  if(view==='dashboard')renderDashboard();
  else if(view==='boq')renderBOQ();
  else if(['purchases','payroll','direct','indirect','goci'].includes(view))renderCostCat(view);
  else if(view==='procurement')renderProcurement();
  else if(view==='suppliers')renderSuppliers();
  else if(view==='timeline')renderTimeline();
  else if(view==='audit')renderAudit();
}

function jumpToProject(id){
  curProj=projects.find(p=>p.id===id);
  if(!curProj)return;
  $('projSel').value=curProj.id;
  $('projStatus').value=curProj.status||'active';
  switchView('dashboard');
  loadProjectData();
}

// == TIMELINE VIEW =====================================================
function renderTimeline(){
  const msList=Array.isArray(curProj.milestones)?curProj.milestones:[];
  const now=today();
  const msRows=msList.length?msList.map((m,i)=>{
    const done=m.date&&m.date<now;
    const late=m.date&&m.date<now&&!m.done;
    return`<tr>
      <td><strong>${esc(m.title)}</strong>${m.note?'<div class="dim">'+esc(m.note)+'</div>':''}</td>
      <td class="mono dim">${fmtDate(m.date)}</td>
      <td>${m.done?'<span class="badge" style="color:#2D7D46;border-color:#2D7D4644">Done</span>':late?'<span class="badge" style="color:#C0392B;border-color:#C0392B44">Late</span>':'<span class="badge" style="color:#888;border-color:#88844">Pending</span>'}</td>
      <td><div style="display:flex;gap:6px">
        <button class="btn btn-sm" style="padding:4px 9px;font-size:12px" onclick="toggleMilestone(${i})">${m.done?'Unmark':'Mark done'}</button>
        <button class="btn btn-sm" style="padding:4px 9px;font-size:12px;color:#C0392B;border-color:#C0392B44" onclick="deleteMilestone(${i})">Delete</button>
      </div></td>
    </tr>`;
  }).join(''):'<tr><td colspan="4"><div class="empty"><strong>No milestones</strong>Add milestones to track project progress over time.</div></td></tr>';

  // Timeline bar
  const start=curProj.start_date,end=curProj.end_date;
  const nowMs=Date.now();
  const startMs=start?new Date(start).getTime():null;
  const endMs=end?new Date(end).getTime():null;
  const timePct=startMs&&endMs&&endMs>startMs?Math.min(100,Math.round((nowMs-startMs)/(endMs-startMs)*100)):null;
  const daysLeft=endMs?Math.round((endMs-nowMs)/86400000):null;
  const timeBar=timePct!==null?`
    <div class="bcard" style="margin-bottom:20px">
      <h4>Project timeline</h4>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px">
        <span class="dim">${fmtDate(start)}</span>
        <span style="font-weight:600;color:${daysLeft<0?'#C0392B':daysLeft<14?'#C8A96E':'#2D7D46'}">${daysLeft===null?'No end date set':daysLeft>0?daysLeft+' days remaining':Math.abs(daysLeft)+' days overdue'}</span>
        <span class="dim">${fmtDate(end)}</span>
      </div>
      <div class="progbar ${daysLeft!==null&&daysLeft<0?'over':''}"><span style="width:${timePct}%"></span></div>
    </div>`:'<div class="dim" style="margin-bottom:20px;padding:14px;border:1px solid var(--border);border-radius:8px">No start/end dates set on this project. Edit the project in the wizard to add dates.</div>';

  $('content').innerHTML=`
    ${timeBar}
    <div class="sec-head">
      <h3>Milestones</h3>
      <button class="btn btn-gold btn-sm" onclick="openMilestone()">+ Add milestone</button>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Milestone</th><th>Date</th><th>Status</th><th></th></tr></thead>
      <tbody>${msRows}</tbody>
    </table></div>`;
}
function openMilestone(){
  modal(`<h2>Add milestone</h2>
    <div class="field"><label>Title</label><input id="msTitle" placeholder="Steel delivery"></div>
    <div class="field"><label>Target date</label><input id="msDate" type="date"></div>
    <div class="field"><label>Note</label><input id="msNote" placeholder="optional"></div>
    <div class="modal-foot">
      <button class="btn btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-gold btn-sm" onclick="saveMilestone()">Add</button>
    </div>`);
  $('msTitle').focus();
}
async function saveMilestone(){
  const title=$('msTitle').value.trim();if(!title)return toast('Title required',1);
  const ms=[...(Array.isArray(curProj.milestones)?curProj.milestones:[]),
    {title,date:$('msDate').value||null,note:$('msNote').value.trim()||null,done:false}];
  const{error}=await sb.from('apm_projects').update({milestones:ms}).eq('id',curProj.id);
  if(error)return toast(error.message,1);
  curProj.milestones=ms;closeModal();toast('Milestone added');renderTimeline();
}
async function toggleMilestone(i){
  const ms=JSON.parse(JSON.stringify(curProj.milestones||[]));
  if(!ms[i])return;ms[i].done=!ms[i].done;
  const{error}=await sb.from('apm_projects').update({milestones:ms}).eq('id',curProj.id);
  if(error)return toast(error.message,1);
  curProj.milestones=ms;renderTimeline();
}
async function deleteMilestone(i){
  const ms=JSON.parse(JSON.stringify(curProj.milestones||[]));
  ms.splice(i,1);
  const{error}=await sb.from('apm_projects').update({milestones:ms}).eq('id',curProj.id);
  if(error)return toast(error.message,1);
  curProj.milestones=ms;renderTimeline();
}

    return`<div class="bcard">

function nextPRNo(){const y=new Date().getFullYear(),p=`PR-${y}-`;const nums=prs.map(x=>x.pr_no).filter(n=>n&&n.startsWith(p)).map(n=>parseInt(n.slice(p.length),10)).filter(n=>!isNaN(
  n));return p+String((nums.length?Math.max(...nums):0)+1).padStart(3,'0');}
function openPR(id){
  const p=id?prs.find(x=>x.id===id):null;
  const readonly=p&&p.status!=='pending';
  modalLg(`<h2>${p?'Purchase request '+esc(p.pr_no||''):'New purchase request'}</h2>
    ${p?prSteps(p):''}
    <div class="f2">
      <div class="field"><label>Item</label><input id="prItem" value="${esc(p?.item||'')}" ${readonly?'disabled':''} placeholder="What needs purchasing?"></div>
      <div class="field"><label>Supplier</label><input id="prSupplier" value="${esc(p?.supplier||'')}" ${readonly?'disabled':''} placeholder="optional"></div>
    </div>
    <div class="f3">
      <div class="field"><label>Qty</label><input id="prQty" type="number" step="any" value="${p?.qty??1}" ${readonly?'disabled':''}></div>
      <div class="field"><label>Amount (SAR)</label><input id="prAmt" type="number" step="any" value="${p?.amount??''}" ${readonly?'disabled':''} oninput="prTierHint()"></div>
      <div class="field"><label>Payment</label><select id="prPay" ${readonly?'disabled':''}><option value="cash" ${p?.payment_type==='cash'?'selected':''}>Cash</option><option value="transfer" ${
        p?.payment_type==='transfer'?'selected':''}>Transfer</option><option value="credit" ${p?.payment_type==='credit'?'selected':''}>Credit</option></select></div>
    </div>
    <div class="dim" id="prTierHint" style="margin-bottom:10px"></div>
    <div class="field"><label>Requested by</label><input id="prBy" value="${esc(p?.requested_by||'')}" ${readonly?'disabled':''} placeholder="your name"></div>
    <div class="field"><label>Note</label><input id="prNote" value="${esc(p?.note||'')}" ${readonly?'disabled':''} placeholder="optional"></div>
    <div class="modal-foot">
      ${p?`<button class="btn btn-danger btn-sm mfl" onclick="delPR('${p.id}')">Delete</button>`:''}
      <button class="btn btn-sm" onclick="closeModal()">Close</button>
      ${!readonly?`<button class="btn btn-gold btn-sm" onclick="savePR('${p?.id||''}')">${p?'Update':'Submit request'}</button>`:''}
      ${p&&['pending','approved_t1','approved_t2'].includes(p.status)?`<button class="btn btn-gold btn-sm" onclick="approvePR('${p.id}')">Approve next step</button>`:''}
    </div>`);
  if(!readonly)prTierHint();
}
function prSteps(p){
  const order=['submitted','approved_t1','approved_t2','approved'];
  const labels=['Submitted','Tier 1','Tier 2','Final'];
  let reached=1;
  if(p.status==='approved_t1')reached=2;else if(p.status==='approved_t2')reached=3;else if(p.status==='approved')reached=4;else if(p.status==='rejected')reached=-1;
  let h='<div class="step">';
  for(let i=0;i<4;i++){
    const cls=p.status==='rejected'?'':i<reached?'done':i===reached?'curr':'';
    h+=`<div class="dot ${cls}">${i<reached?'&#10003;':i+1}</div><span class="dim" style="font-size:12px;margin:0 4px">${labels[i]}</span>`;
    if(i<3)h+='<div class="line"></div>';
  }
  h+='</div>';
  if(p.status==='rejected')h='<div class="alertbar">This request was rejected.</div>';
  return h;
}
function prTierHint(){const amt=num($('prAmt').value);const t=prTier(amt);const names=[curProj?.tier1_name||'Tier 1',curProj?.tier2_name||'Tier 2',curProj?.tier3_name||'Tier 3'];$('prTierHint').textContent=amt?`Routes to ${names[t-1]} (Tier ${t}) approval`:'';
  }
async function savePR(id){
  const item=$('prItem').value.trim();if(!item)return toast('Item required',1);
  const amount=num($('prAmt').value);
  const rec={project_id:curProj.id,item,supplier:$('prSupplier').value.trim()||null,qty:num($('prQty').value)||1,amount,payment_type:$('prPay').value,requested_by:$('prBy').value.trim(
    )||null,note:$('prNote').value.trim()||null,tier:prTier(amount)};
  if(!id){rec.pr_no=nextPRNo();rec.status='pending';}
  const{error}=await(id?sb.from('apm_purchase_requests').update(rec).eq('id',id):sb.from('apm_purchase_requests').insert(rec));
  if(error)return toast(error.message,1);
  logAudit(id?'pr_edit':'pr_submit',(rec.pr_no||'')+' . '+item+' . '+fmtSAR(amount));
  closeModal();toast(id?'Request updated':'Request submitted');loadProjectData();
}
async function approvePR(id){
  const p=prs.find(x=>x.id===id);if(!p)return;
  const tier=p.tier||prTier(num(p.amount));
  let next;
  // Number of approval steps depends on tier: tier1=1 step, tier2=2 steps, tier3=3 steps
  if(p.status==='pending'){next=tier===1?'approved':'approved_t1';}
  else if(p.status==='approved_t1'){next=tier===2?'approved':'approved_t2';}
  else if(p.status==='approved_t2'){next='approved';}
  else return;
  const{error}=await sb.from('apm_purchase_requests').update({status:next}).eq('id',id);
  if(error)return toast(error.message,1);
  logAudit('pr_approve',(p.pr_no||'')+' &#8594; '+next);
  // When fully approved, auto-create a purchase cost entry
  if(next==='approved'){
    await sb.from('apm_costs').insert({project_id:curProj.id,category:'purchase',subtype:p.payment_type||'cash',description:p.item+(p.pr_no?' ('+p.pr_no+')':''),vendor:p.supplier||null,
      amount:num(p.amount),cost_date:today(),note:'Auto-created from approved PR'});
    logAudit('pr_to_cost',(p.pr_no||'')+' booked as purchase cost');
  }
  closeModal();toast(next==='approved'?'Fully approved - booked as cost':'Approved to next tier');loadProjectData();
}
async function rejectPR(id){const p=prs.find(x=>x.id===id);if(!p||!confirm('Reject this request?'))return;const{error}=await sb.from('apm_purchase_requests').update({status:'rejected'}).eq(
  'id',id);if(error)return toast(error.message,1);logAudit('pr_reject',p.pr_no||'');toast('Rejected');loadProjectData();}
async function delPR(id){if(!confirm('Delete this request?'))return;const{error}=await sb.from('apm_purchase_requests').delete().eq('id',id);if(error)return toast(error.message,1);logAudit(
  'pr_delete','');closeModal();toast('Deleted');loadProjectData();}

    <div class="modal-foot">
      <button class="btn btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-gold btn-sm" onclick="saveWizard()">Create project</button>
    </div>`);
  $('wName').focus();
}
async function saveWizard(){
  const name=$('wName').value.trim();if(!name)return toast('Project name required',1);
  const rec={name,client:$('wClient').value.trim()||null,start_date:$('wStart').value||null,end_date:$('wEnd').value||null,description:$('wDesc').value.trim()||null,status:'active',
    budget_purchases:num($('wbPurchases').value),budget_payroll:num($('wbPayroll').value),budget_direct:num($('wbDirect').value),budget_indirect:num($('wbIndirect').value),budget_goci:num(
      $('wbGoci').value),
    tier1_name:$('wt1n').value.trim()||'Tier 1',tier1_max:num($('wt1m').value),tier2_name:$('wt2n').value.trim()||'Tier 2',tier2_max:num($('wt2m').value),tier3_name:$('wt3n').value.trim()||'Tier 3'};
  const{data,error}=await sb.from('apm_projects').insert(rec).select();
  if(error)return toast(error.message,1);
  if(data&&data[0])curProj=data[0];
  logAudit('project_create',name);
  closeModal();toast('Project created');loadProjects();
}

// &#9472;&#9472; Compare projects &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;
async function openCompare(){
  modalLg(`<h2>Compare projects</h2><div class="loading" id="cmpBody">Loading&#8230;</div>`);
  const{data:allCosts}=await sb.from('apm_costs').select('project_id,amount');
  const{data:allBoq}=await sb.from('apm_boq').select('project_id,amount');
  const rows=projects.map(p=>{
    const c=(allCosts||[]).filter(x=>x.project_id===p.id).reduce((s,x)=>s+num(x.amount),0);
    const bq=(allBoq||[]).filter(x=>x.project_id===p.id).reduce((s,x)=>s+num(x.amount),0);
    const m=bq-c,mp=bq?(m/bq*100):0;
    return`<tr><td><strong>${esc(p.name)}</strong><div class="dim">${esc(p.client||'')}</div></td>
      <td class="mono right">${fmtSAR(bq)}</td><td class="mono right">${fmtSAR(c)}</td>
      <td class="mono right" style="color:${m<0?'#C0392B':'#2D7D46'}">${fmtSAR(m)}</td>
      <td class="mono right" style="color:${m<0?'#C0392B':'#2D7D46'}">${mp.toFixed(1)}%</td></tr>`;
  }).join('');
  $('cmpBody').outerHTML=`<div class="tbl-wrap"><table><thead><tr><th>Project</th><th class="right">BOQ</th><th class="right">Cost</th><th class="right">Margin</th><th class="right">Margin %</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="modal-foot"><button class="btn btn-sm" onclick="closeModal()">Close</button></div>`;
}

// &#9472;&#9472; Exports &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;
function exportExcel(){
  if(!curProj)return toast('No project selected',1);
  // CSV (opens in Excel) - costs + BOQ
  let csv='APM Metal Works - '+curProj.name+'\n\nBOQ\nItem,Unit,Qty,Rate,Amount\n';
  boq.forEach(b=>{csv+=`"${(b.item||'').replace(/"/g,'""')}",${b.unit||''},${num(b.qty)},${num(b.rate)},${num(b.amount)}\n`;});
  csv+=`,,,BOQ Total,${boqTotal()}\n\nCosts\nDate,Category,Type,Description,Vendor,Amount\n`;
  costs.forEach(c=>{csv+=`${c.cost_date||''},${CAT[c.category]?.label||c.category},${c.subtype||''},"${(c.description||'').replace(/"/g,'""')}","${(c.vendor||'').replace(/"/g,'""')}",${num(c.amount)}\n`;
    });
  csv+=`,,,,Total Cost,${totalCost()}\n,,,,Net Margin,${boqTotal()-totalCost()}\n`;
  const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=curProj.name.replace(/\s+/g,'_')+'_cost_report.csv';a.click();
  logAudit('export_excel',curProj.name);toast('Excel/CSV exported');
}
function exportPDF(){
  if(!curProj)return toast('No project selected',1);
  const boqVal=boqTotal(),tCost=totalCost(),m=boqVal-tCost;
  const catRows=Object.keys(CAT).map(k=>
    '<tr><td>'+CAT[k].label+'</td>'
    +'<td style="text-align:right">SAR '+budgetByCat(k).toLocaleString()+'</td>'
    +'<td style="text-align:right">SAR '+costByCat(k).toLocaleString()+'</td>'
    +'<td style="text-align:right">SAR '+(budgetByCat(k)-costByCat(k)).toLocaleString()+'</td>'
    +'</tr>'
  ).join('');
  var pdfCss='<style>'
    +'body{font-family:Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 24px;color:#111}'
    +'h1{font-size:20px;border-bottom:2px solid #C8A96E;padding-bottom:10px}'
    +'.brand{font-size:18px;font-weight:800}.brand span{color:#C8A96E}'
    +'table{width:100%;border-collapse:collapse;margin-top:18px;font-size:13px}'
    +'th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}'
    +'th{color:#666;font-size:11px;text-transform:uppercase}'
    +'td:not(:first-child),th:not(:first-child){text-align:right}'
    +'.tot td{border-top:2px solid #111;font-weight:800}'
    +'</style>';
  var pdfBody=''
    +'<div class="brand">APM <span>Metal Works</span></div>'
    +'<h1>Cost Report - '+esc(curProj.name)+'</h1>'
    +'<div style="font-size:13px;color:#555">'
    +'Client: '+esc(curProj.client||'-')
    +' . Status: '+esc(curProj.status||'active')
    +' . '+new Date().toLocaleDateString('en-GB')
    +'</div>'
    +'<table>'
    +'<tr><td><strong>BOQ value</strong></td>'
    +'<td><strong>SAR '+boqVal.toLocaleString()+'</strong></td></tr>'
    +'<tr><td>Total cost</td>'
    +'<td>SAR '+tCost.toLocaleString()+'</td></tr>'
    +'<tr class="tot"><td>Net margin ('
    +(boqVal?(m/boqVal*100).toFixed(1):0)+'%)</td>'
    +'<td>SAR '+m.toLocaleString()+'</td></tr>'
    +'</table>'
    +'<h1 style="font-size:15px;margin-top:30px">Budget vs Actual</h1>'
    +'<table><thead><tr>'
    +'<th>Category</th><th>Budget</th><th>Actual</th><th>Remaining</th>'
    +'</tr></thead><tbody>'+catRows+'</tbody></table>';
  var pdfPrint='<scr'+'ipt>window.onload=function(){window.print();}</scr'+'ipt>';
  var w=window.open('','_blank');
  w.document.write('<!DOCTYPE html><html><head>'+pdfCss+'</head><body>'+pdfBody+pdfPrint+'</body></html>');
  w.document.close();
  logAudit('export_pdf',curProj.name);
}

function whatsappSummary(){
  if(!curProj)return toast('No project selected',1);
  const boqVal=boqTotal(),tCost=totalCost(),m=boqVal-tCost,mp=boqVal?(m/boqVal*100).toFixed(1):0;
  let msg=`*APM Cost Summary - ${curProj.name}*\n`;
  msg+=`BOQ: SAR ${boqVal.toLocaleString()}\nCost: SAR ${tCost.toLocaleString()}\nMargin: SAR ${m.toLocaleString()} (${mp}%)\n\n`;
  Object.keys(CAT).forEach(k=>{msg+=`${CAT[k].label}: SAR ${costByCat(k).toLocaleString()}\n`;});
  const pend=prs.filter(p=>['pending','approved_t1','approved_t2'].includes(p.status)).length;
  if(pend)msg+=`\n${pend} pending approval(s)`;
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

loadFX();
loadProjects();
