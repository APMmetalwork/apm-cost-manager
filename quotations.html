<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quotations — APM Metal Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg0:#0B0E12; --bg1:#12161C; --bg2:#1A2027; --bg3:#212935;
    --line:#242C36; --line-hi:#33404E;
    --text:#E8ECF1; --muted:#8C97A6;
    --amber:#F08C2E; --amber-soft:rgba(240,140,46,.14);
    --steel:#5B7A9D; --green:#3FB970; --red:#E5534B; --blue:#4D9DE0;
    --radius:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg0);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh}
  button{font-family:inherit}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px 24px;border-bottom:1px solid var(--line);
    background:rgba(18,22,28,.85);backdrop-filter:blur(8px);
    position:sticky;top:0;z-index:40;
  }
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
  .mark{width:36px;height:36px;border-radius:9px;background:linear-gradient(145deg,#222A33,#141A21);
    border:1px solid var(--line-hi);display:grid;place-items:center;
    font-family:'Saira',sans-serif;font-weight:800;font-size:14px;color:var(--amber)}
  .brand b{font-family:'Saira',sans-serif;font-weight:700;font-size:15px}
  .brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}

  .btn{
    border:1px solid var(--line-hi);background:var(--bg2);color:var(--text);
    padding:9px 16px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;
    transition:border-color .15s,background .15s;
  }
  .btn:hover{border-color:var(--amber)}
  .btn.primary{background:var(--amber);border-color:var(--amber);color:#1A1208}
  .btn.primary:hover{background:#FFA04A}
  .btn.danger{color:var(--red);border-color:rgba(229,83,75,.5)}
  .btn.green{color:var(--green);border-color:rgba(63,185,112,.5)}
  .btn.sm{padding:6px 11px;font-size:12.5px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .wrap{max-width:1280px;margin:0 auto;padding:24px}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:linear-gradient(180deg,var(--bg2),var(--bg1));border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .stat .lbl{color:var(--muted);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
  .stat .val{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:600;margin-top:6px}
  .stat .val.amber{color:var(--amber)} .stat .val.green{color:var(--green)}

  .toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  .tabs{display:flex;gap:4px;background:var(--bg1);border:1px solid var(--line);border-radius:10px;padding:4px;flex-wrap:wrap}
  .tab{border:none;background:transparent;color:var(--muted);padding:8px 16px;border-radius:7px;font-size:13.5px;font-weight:600;cursor:pointer}
  .tab.active{background:var(--bg3);color:var(--text)}
  .search{
    flex:1;min-width:200px;max-width:340px;
    background:var(--bg1);border:1px solid var(--line);border-radius:9px;
    color:var(--text);padding:10px 14px;font-size:13.5px;font-family:inherit;
  }
  .search:focus{outline:none;border-color:var(--amber)}

  .panel{background:var(--bg1);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;padding:12px 16px;color:var(--muted);font-size:11.5px;letter-spacing:.09em;
     text-transform:uppercase;font-weight:600;border-bottom:1px solid var(--line);background:var(--bg2);white-space:nowrap}
  td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:rgba(255,255,255,.02)}
  .mono{font-family:'JetBrains Mono',monospace;font-size:12.5px}
  .muted{color:var(--muted)}
  .pill{display:inline-block;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid}
  .rowbtns{display:flex;gap:6px;justify-content:flex-end}
  .iconbtn{border:1px solid var(--line-hi);background:transparent;color:var(--muted);
    width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1}
  .iconbtn:hover{color:var(--text);border-color:var(--amber)}
  .empty-state{padding:48px 20px;text-align:center;color:var(--muted);font-size:14px}
  .empty-state b{color:var(--text)}

  /* ---------- editor overlay ---------- */
  .overlay{position:fixed;inset:0;background:rgba(5,8,12,.72);backdrop-filter:blur(3px);
    display:none;align-items:flex-start;justify-content:center;z-index:60;padding:4vh 16px;overflow-y:auto}
  .overlay.open{display:flex}
  .modal{background:var(--bg1);border:1px solid var(--line-hi);border-radius:16px;width:100%;max-width:880px;padding:24px}
  .modal h2{font-family:'Saira',sans-serif;font-size:19px;font-weight:700;margin-bottom:18px}
  .field label{display:block;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
  .field input,.field select,.field textarea{
    width:100%;background:var(--bg0);border:1px solid var(--line-hi);border-radius:9px;
    color:var(--text);padding:10px 12px;font-size:14px;font-family:inherit;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--amber)}
  .frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
  .field{min-width:0}

  /* items editor */
  .items-head,.item-row{
    display:grid;gap:8px;align-items:center;
    grid-template-columns:140px 1fr 80px 90px 110px 110px 34px;
  }
  .items-head{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
    padding:0 0 6px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .item-row{margin-bottom:8px}
  .item-row input,.item-row select{
    width:100%;background:var(--bg0);border:1px solid var(--line-hi);border-radius:8px;
    color:var(--text);padding:8px 9px;font-size:13px;font-family:inherit;min-width:0;
  }
  .item-row input:focus,.item-row select:focus{outline:none;border-color:var(--amber)}
  .item-row .line-total{font-family:'JetBrains Mono',monospace;font-size:12.5px;text-align:right;color:var(--amber)}
  .item-row .del{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:15px}
  .item-row .del:hover{color:var(--red)}
  @media(max-width:760px){
    .items-head{display:none}
    .item-row{grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;padding:10px}
    .item-row .line-total{text-align:left}
  }

  .totals{margin-top:16px;margin-left:auto;width:280px;max-width:100%;font-size:14px}
  .totals .trow{display:flex;justify-content:space-between;padding:6px 0;color:var(--muted)}
  .totals .trow b{color:var(--text)}
  .totals .grand{border-top:1px solid var(--line-hi);margin-top:6px;padding-top:10px;font-size:16px}
  .totals .grand b{color:var(--amber);font-family:'JetBrains Mono',monospace}
  .modal-foot{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
  .modal-foot .right{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}

  #toasts{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:9px;z-index:90}
  .toast{background:var(--bg2);border:1px solid var(--line-hi);border-left:3px solid var(--amber);
    border-radius:10px;padding:12px 16px;font-size:13.5px;min-width:230px;animation:slidein .22s ease}
  .toast.err{border-left-color:var(--red)}
  @keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
  .loading{padding:60px;text-align:center;color:var(--muted)}

  /* ---------- print view ---------- */
  #printArea{display:none}
  @media print{
    body *{visibility:hidden}
    #printArea,#printArea *{visibility:visible}
    #printArea{
      display:block;position:absolute;inset:0;background:#fff;color:#111;
      font-family:'Inter',sans-serif;padding:40px;
    }
    .p-head{display:flex;justify-content:space-between;border-bottom:3px solid #222;padding-bottom:16px;margin-bottom:22px}
    .p-head h1{font-family:'Saira',sans-serif;font-size:26px}
    .p-head .qno{text-align:right;font-family:'JetBrains Mono',monospace}
    .p-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin-bottom:22px;font-size:13px}
    .p-meta b{display:inline-block;min-width:110px}
    #printArea table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:18px}
    #printArea th{background:#222;color:#fff;padding:8px 10px;text-align:left}
    #printArea td{padding:8px 10px;border-bottom:1px solid #ccc}
    .p-tot{margin-left:auto;width:260px;font-size:13.5px}
    .p-tot div{display:flex;justify-content:space-between;padding:4px 0}
    .p-tot .g{border-top:2px solid #222;font-weight:700;font-size:15px;padding-top:8px}
    .p-foot{margin-top:30px;font-size:11.5px;color:#555;border-top:1px solid #ccc;padding-top:12px}
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="index.html">
    <div class="mark">AP</div>
    <div><b>Quotations</b><small>APM Metal Works</small></div>
  </a>
  <div class="actions">
    <button class="btn primary" onclick="openEditor()">+ New quote</button>
  </div>
</div>

<div class="wrap">
  <div class="stats">
    <div class="stat"><div class="lbl">Total Quotes</div><div class="val" id="stTotal">—</div></div>
    <div class="stat"><div class="lbl">Awaiting Reply</div><div class="val" id="stSent">—</div></div>
    <div class="stat"><div class="lbl">Accepted Value</div><div class="val green" id="stAccepted">—</div></div>
    <div class="stat"><div class="lbl">Acceptance Rate</div><div class="val amber" id="stRate">—</div></div>
  </div>

  <div class="toolbar">
    <div class="tabs" id="statusTabs">
      <button class="tab active" data-f="all">All</button>
      <button class="tab" data-f="draft">Draft</button>
      <button class="tab" data-f="sent">Sent</button>
      <button class="tab" data-f="accepted">Accepted</button>
      <button class="tab" data-f="rejected">Rejected</button>
    </div>
    <input class="search" id="search" placeholder="Search quotes…" oninput="renderList()">
  </div>

  <div id="list"><div class="loading">Loading quotes…</div></div>
</div>

<!-- ---------- quote editor ---------- -->
<div class="overlay" id="editorOverlay">
  <div class="modal">
    <h2 id="editorTitle">New quote</h2>
    <input type="hidden" id="qId">
    <div class="frow">
      <div class="field"><label>Quote #</label><input id="qNo" readonly style="opacity:.7"></div>
      <div class="field"><label>Date</label><input id="qDate" type="date"></div>
      <div class="field"><label>Valid for (days)</label><input id="qValid" type="number" min="1" value="30"></div>
      <div class="field"><label>Status</label>
        <select id="qStatus">
          <option value="draft">Draft</option>
          <option value="sent">Sent</option>
          <option value="accepted">Accepted</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
    </div>
    <div class="frow">
      <div class="field"><label>Client (from CRM)</label><select id="qContact" onchange="syncClientName()"></select></div>
      <div class="field"><label>Client name *</label><input id="qClient" placeholder="Al-Rajhi Steel Co."></div>
      <div class="field"><label>Project name *</label><input id="qProject" placeholder="Warehouse mezzanine — Sulay"></div>
    </div>

    <div class="items-head">
      <div>Category</div><div>Description</div><div>Qty</div><div>Unit</div><div>Unit price</div><div>Total</div><div></div>
    </div>
    <div id="itemRows"></div>
    <button class="btn sm" onclick="addItemRow()">+ Add line item</button>

    <div class="totals">
      <div class="trow"><span>Subtotal</span><b id="tSub" class="mono">SAR 0</b></div>
      <div class="trow"><span>VAT 15%</span><b id="tVat" class="mono">SAR 0</b></div>
      <div class="trow grand"><span>Total</span><b id="tGrand">SAR 0</b></div>
    </div>

    <div class="field" style="margin-top:6px"><label>Notes / terms</label><textarea id="qNotes" rows="2" placeholder="50% advance, balance on handover. Prices include paint finish."></textarea></div>

    <div class="modal-foot">
      <button class="btn danger" id="qDelete" style="display:none" onclick="deleteQuote()">Delete</button>
      <div class="right">
        <button class="btn" onclick="closeEditor()">Cancel</button>
        <button class="btn" id="qPrint" style="display:none" onclick="printQuote()">Print / PDF</button>
        <button class="btn green" id="qWa" style="display:none" onclick="sendWhatsApp()">Send via WhatsApp</button>
        <button class="btn primary" onclick="saveQuote()">Save quote</button>
      </div>
    </div>
  </div>
</div>

<div id="printArea"></div>
<div id="toasts"></div>

<script>
const SB_URL = 'https://spfztpokbpomqtiqgggz.supabase.co';
const SB_KEY = 'sb_publishable_xPXU0xL_YaiWA6k9PWc0Xg_4QYeypNi';
const sb = supabase.createClient(SB_URL, SB_KEY);

/* ============================================================
   COST MANAGER INTEGRATION — EDIT THIS BLOCK
   When a quote is marked Accepted, a project row is inserted
   into your Cost Manager. Set the table + column names below to
   match your existing Cost Manager schema exactly.
   ============================================================ */
const COST_MANAGER = {
  table: 'apm_projects',
  map: rec => ({
    name:             rec.project_name,
    client:           rec.client_name,
    description:      'Generated from quote ' + rec.quote_no,
    status:           'active',
    start_date:       new Date().toISOString().slice(0, 10),
    end_date:         null,
    budget_purchases: rec.total,
    budget_payroll:   0,
    budget_direct:    0,
    budget_indirect:  0,
    budget_goci:      0,
    tier1_name:       null, tier1_max: null,
    tier2_name:       null, tier2_max: null,
    tier3_name:       null,
  })
};
/* ============================================================ */

const VAT_RATE = 0.15;
const CATEGORIES = ['Fabrication', 'Installation', 'Material', 'Labor', 'Other'];
const UNITS = ['kg', 'unit', 'm', 'm²', 'lot', 'hour', 'day'];
const STATUS = {
  draft:    { label:'Draft',    color:'#8C97A6' },
  sent:     { label:'Sent',     color:'#4D9DE0' },
  accepted: { label:'Accepted', color:'#3FB970' },
  rejected: { label:'Rejected', color:'#E5534B' },
};

let quotes = [];
let contacts = [];
let statusFilter = 'all';

const $ = id => document.getElementById(id);
const esc = s => (s ?? '').toString()
  .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
  .replaceAll('"','&quot;').replaceAll("'",'&#39;');
const fmtSAR = n => 'SAR ' + Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) : '—';
const todayISO = () => new Date().toISOString().slice(0, 10);

function toast(msg, isErr) {
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

/* ---------- data ---------- */
async function loadAll() {
  const [qRes, cRes] = await Promise.all([
    sb.from('quotes').select('*, quote_items(*)').order('created_at', { ascending:false }),
    sb.from('crm_contacts').select('id,name,company,phone').order('name'),
  ]);
  if (qRes.error) {
    toast('Could not load quotes: ' + qRes.error.message, true);
    $('list').innerHTML = '<div class="panel"><div class="empty-state">Could not reach the database.<br>Run quotations_setup.sql in Supabase first.</div></div>';
    return;
  }
  quotes = qRes.data;
  contacts = cRes.data || [];
  renderStats();
  renderList();
}

function nextQuoteNo() {
  const year = new Date().getFullYear();
  const prefix = `APM-Q-${year}-`;
  const nums = quotes
    .filter(q => (q.quote_no || '').startsWith(prefix))
    .map(q => parseInt(q.quote_no.slice(prefix.length), 10) || 0);
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return prefix + String(next).padStart(3, '0');
}

/* ---------- list ---------- */
function renderStats() {
  const sent = quotes.filter(q => q.status === 'sent');
  const accepted = quotes.filter(q => q.status === 'accepted');
  const decided = accepted.length + quotes.filter(q => q.status === 'rejected').length;
  $('stTotal').textContent = quotes.length;
  $('stSent').textContent = sent.length;
  $('stAccepted').textContent = fmtSAR(accepted.reduce((s, q) => s + Number(q.total || 0), 0));
  $('stRate').textContent = decided ? Math.round(accepted.length / decided * 100) + '%' : '—';
}

function renderList() {
  const q = $('search').value.trim().toLowerCase();
  let list = quotes;
  if (statusFilter !== 'all') list = list.filter(x => x.status === statusFilter);
  if (q) list = list.filter(x =>
    [x.quote_no, x.client_name, x.project_name, x.notes].some(v => (v || '').toLowerCase().includes(q)));

  if (!list.length) {
    $('list').innerHTML = '<div class="panel"><div class="empty-state"><b>No quotes here.</b><br>Create a quote to start winning work.</div></div>';
    return;
  }
  const rows = list.map(x => {
    const s = STATUS[x.status] || STATUS.draft;
    const validUntil = x.quote_date && x.valid_days
      ? new Date(new Date(x.quote_date).getTime() + x.valid_days * 86400000) : null;
    const expired = validUntil && validUntil < new Date() && (x.status === 'draft' || x.status === 'sent');
    return `
      <tr>
        <td class="mono"><b>${esc(x.quote_no)}</b></td>
        <td><b>${esc(x.project_name)}</b><div class="muted" style="font-size:12px">${esc(x.client_name)}</div></td>
        <td class="mono">${fmtSAR(x.total)}</td>
        <td><span class="pill" style="color:${s.color};border-color:${s.color}55">${s.label}</span>
            ${expired ? '<div class="muted" style="font-size:11px;margin-top:3px">expired</div>' : ''}</td>
        <td class="mono muted">${fmtDate(x.quote_date)}</td>
        <td class="mono muted">${x.quote_items?.length || 0} items</td>
        <td><div class="rowbtns"><button class="iconbtn" title="Open" onclick="openEditor('${x.id}')">✎</button></div></td>
      </tr>`;
  }).join('');
  $('list').innerHTML = `
    <div class="panel"><table>
      <thead><tr><th>Quote #</th><th>Project / Client</th><th>Total</th><th>Status</th><th>Date</th><th>Items</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

document.querySelectorAll('#statusTabs .tab').forEach(t =>
  t.addEventListener('click', () => {
    statusFilter = t.dataset.f;
    document.querySelectorAll('#statusTabs .tab').forEach(x => x.classList.toggle('active', x === t));
    renderList();
  }));

/* ---------- editor ---------- */
function itemRowHTML(it = {}) {
  return `
    <div class="item-row">
      <select class="i-cat">${CATEGORIES.map(c => `<option ${c === it.category ? 'selected' : ''}>${c}</option>`).join('')}</select>
      <input class="i-desc" placeholder="MS plate 6mm, cut + weld" value="${esc(it.description || '')}">
      <input class="i-qty" type="number" min="0" step="any" value="${it.qty ?? 1}" oninput="recalc()">
      <select class="i-unit">${UNITS.map(u => `<option ${u === it.unit ? 'selected' : ''}>${u}</option>`).join('')}</select>
      <input class="i-price" type="number" min="0" step="any" value="${it.unit_price ?? ''}" placeholder="0" oninput="recalc()">
      <div class="line-total">SAR 0</div>
      <button class="del" title="Remove" onclick="this.closest('.item-row').remove(); recalc()">✕</button>
    </div>`;
}

function addItemRow(it) {
  $('itemRows').insertAdjacentHTML('beforeend', itemRowHTML(it));
  recalc();
}

function readItems() {
  return [...document.querySelectorAll('.item-row')].map(r => ({
    category: r.querySelector('.i-cat').value,
    description: r.querySelector('.i-desc').value.trim(),
    qty: Number(r.querySelector('.i-qty').value || 0),
    unit: r.querySelector('.i-unit').value,
    unit_price: Number(r.querySelector('.i-price').value || 0),
  })).filter(it => it.description || it.unit_price);
}

function recalc() {
  let sub = 0;
  document.querySelectorAll('.item-row').forEach(r => {
    const t = Number(r.querySelector('.i-qty').value || 0) * Number(r.querySelector('.i-price').value || 0);
    r.querySelector('.line-total').textContent = fmtSAR(t);
    sub += t;
  });
  const vat = sub * VAT_RATE;
  $('tSub').textContent = fmtSAR(sub);
  $('tVat').textContent = fmtSAR(vat);
  $('tGrand').textContent = fmtSAR(sub + vat);
}

function syncClientName() {
  const c = contacts.find(x => x.id === $('qContact').value);
  if (c) $('qClient').value = c.company || c.name;
}

function openEditor(id) {
  const x = id ? quotes.find(q => q.id === id) : null;
  $('editorTitle').textContent = x ? 'Quote ' + x.quote_no : 'New quote';
  $('qId').value = x?.id || '';
  $('qNo').value = x?.quote_no || nextQuoteNo();
  $('qDate').value = x?.quote_date || todayISO();
  $('qValid').value = x?.valid_days ?? 30;
  $('qStatus').value = x?.status || 'draft';
  $('qContact').innerHTML = '<option value="">— Pick from CRM —</option>' +
    contacts.map(c => `<option value="${c.id}">${esc(c.name)}${c.company ? ' · ' + esc(c.company) : ''}</option>`).join('');
  $('qContact').value = x?.contact_id || '';
  $('qClient').value = x?.client_name || '';
  $('qProject').value = x?.project_name || '';
  $('qNotes').value = x?.notes || '';
  $('qDelete').style.display = x ? '' : 'none';
  $('qPrint').style.display = x ? '' : 'none';
  $('qWa').style.display = x ? '' : 'none';
  $('itemRows').innerHTML = '';
  const items = x?.quote_items?.length ? [...x.quote_items].sort((a, b) => a.sort_order - b.sort_order) : [{}];
  items.forEach(it => addItemRow(it));
  $('editorOverlay').classList.add('open');
}
function closeEditor() { $('editorOverlay').classList.remove('open'); }

async function saveQuote() {
  const id = $('qId').value;
  const items = readItems();
  const subtotal = items.reduce((s, it) => s + it.qty * it.unit_price, 0);
  const vat = +(subtotal * VAT_RATE).toFixed(2);
  const newStatus = $('qStatus').value;
  const rec = {
    quote_no: $('qNo').value,
    quote_date: $('qDate').value || todayISO(),
    valid_days: Number($('qValid').value || 30),
    contact_id: $('qContact').value || null,
    client_name: $('qClient').value.trim(),
    project_name: $('qProject').value.trim(),
    status: newStatus,
    subtotal: +subtotal.toFixed(2),
    vat,
    total: +(subtotal + vat).toFixed(2),
    notes: $('qNotes').value.trim() || null,
  };
  if (!rec.client_name) return toast('Client name is required', true);
  if (!rec.project_name) return toast('Project name is required', true);
  if (!items.length) return toast('Add at least one line item', true);

  const wasAccepted = id ? (quotes.find(q => q.id === id)?.status === 'accepted') : false;

  let quoteId = id;
  if (id) {
    const { error } = await sb.from('quotes').update(rec).eq('id', id);
    if (error) return toast('Save failed: ' + error.message, true);
  } else {
    const { data, error } = await sb.from('quotes').insert(rec).select('id').single();
    if (error) return toast('Save failed: ' + error.message, true);
    quoteId = data.id;
  }

  // replace items
  await sb.from('quote_items').delete().eq('quote_id', quoteId);
  const { error: iErr } = await sb.from('quote_items').insert(
    items.map((it, i) => ({ ...it, quote_id: quoteId, sort_order: i })));
  if (iErr) return toast('Items save failed: ' + iErr.message, true);

  // auto-create project in Cost Manager on first acceptance
  if (newStatus === 'accepted' && !wasAccepted) {
    const { error: pErr } = await sb.from(COST_MANAGER.table).insert(COST_MANAGER.map(rec));
    if (pErr) toast('Quote saved, but project creation failed: ' + pErr.message + ' — check the COST_MANAGER config in quotations.html', true);
    else toast('Project created in Cost Manager 🏗️');
  }

  closeEditor();
  toast(id ? 'Quote updated' : 'Quote ' + rec.quote_no + ' created');
  loadAll();
}

async function deleteQuote() {
  const id = $('qId').value;
  if (!id || !confirm('Delete this quote and its line items?')) return;
  const { error } = await sb.from('quotes').delete().eq('id', id);
  if (error) return toast('Delete failed: ' + error.message, true);
  closeEditor();
  toast('Quote deleted');
  loadAll();
}

/* ---------- print / send ---------- */
function buildPrint(x) {
  const validUntil = new Date(new Date(x.quote_date).getTime() + (x.valid_days || 30) * 86400000);
  const items = [...(x.quote_items || [])].sort((a, b) => a.sort_order - b.sort_order);
  const rows = items.map(it => `
    <tr>
      <td>${esc(it.category)}</td><td>${esc(it.description)}</td>
      <td>${it.qty} ${esc(it.unit)}</td><td>${fmtSAR(it.unit_price)}</td>
      <td>${fmtSAR(it.qty * it.unit_price)}</td>
    </tr>`).join('');
  $('printArea').innerHTML = `
    <div class="p-head">
      <div><h1>APM Metal Works</h1><div>Quotation</div></div>
      <div class="qno"><b>${esc(x.quote_no)}</b><br>${fmtDate(x.quote_date)}</div>
    </div>
    <div class="p-meta">
      <div><b>Client:</b> ${esc(x.client_name)}</div>
      <div><b>Project:</b> ${esc(x.project_name)}</div>
      <div><b>Valid until:</b> ${fmtDate(validUntil)}</div>
      <div><b>Currency:</b> Saudi Riyal (SAR)</div>
    </div>
    <table>
      <thead><tr><th>Category</th><th>Description</th><th>Qty</th><th>Unit price</th><th>Total</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="p-tot">
      <div><span>Subtotal</span><span>${fmtSAR(x.subtotal)}</span></div>
      <div><span>VAT 15%</span><span>${fmtSAR(x.vat)}</span></div>
      <div class="g"><span>Total</span><span>${fmtSAR(x.total)}</span></div>
    </div>
    ${x.notes ? `<div class="p-foot"><b>Terms:</b> ${esc(x.notes)}</div>` : ''}
    <div class="p-foot">This quotation is valid until ${fmtDate(validUntil)}. Prices include VAT at 15%.</div>`;
}

function printQuote() {
  const x = quotes.find(q => q.id === $('qId').value);
  if (!x) return;
  buildPrint(x);
  window.print();
}

function sendWhatsApp() {
  const x = quotes.find(q => q.id === $('qId').value);
  if (!x) return;
  const c = contacts.find(k => k.id === x.contact_id);
  const phone = (c?.phone || '').replace(/\D/g, '');
  const lines = [
    `*APM Metal Works — Quotation ${x.quote_no}*`,
    `Project: ${x.project_name}`,
    `Client: ${x.client_name}`,
    '',
    ...[...(x.quote_items || [])].sort((a, b) => a.sort_order - b.sort_order)
      .map(it => `• ${it.category}: ${it.description} — ${it.qty} ${it.unit} × ${fmtSAR(it.unit_price)}`),
    '',
    `Subtotal: ${fmtSAR(x.subtotal)}`,
    `VAT 15%: ${fmtSAR(x.vat)}`,
    `*Total: ${fmtSAR(x.total)}*`,
    '',
    `Valid for ${x.valid_days} days from ${fmtDate(x.quote_date)}.`,
  ];
  const url = (phone ? `https://wa.me/${phone}` : 'https://wa.me/') + '?text=' + encodeURIComponent(lines.join('\n'));
  window.open(url, '_blank');
}

/* ---------- misc ---------- */
document.querySelectorAll('.overlay').forEach(o =>
  o.addEventListener('click', e => { if (e.target === o) closeEditor(); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeEditor(); });

loadAll();
</script>
