<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Work Orders -- APM Metal Works</title>
<script>
(function(){
  var K='apm_auth',T=10*60*60*1000;
  try{var s=JSON.parse(sessionStorage.getItem(K));if(!s||Date.now()-s.ts>T)throw 0;}
  catch(e){window.location.href='login.html';return;}
  document.addEventListener('DOMContentLoaded',function(){
    document.body.style.display='none';
    var gate=document.createElement('div');gate.id='mod-gate';
    gate.innerHTML='<style>#mod-gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg,#fff);z-index:9999;font-family:inherit}#mod-gate .gc{width:100%;max-width:360px;padding:24px;border:1px solid var(--border,#d8d8d8);border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.08)}#mod-gate h2{font-size:17px;font-weight:700;margin-bottom:4px}#mod-gate p{font-size:13px;color:var(--text3,#888);margin-bottom:20px}#mod-gate label{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3,#888);margin-bottom:7px}#mod-gate input{width:100%;padding:11px 13px;border:1px solid var(--border,#d8d8d8);border-radius:6px;background:var(--bg1,#f5f5f5);color:var(--text,#0a0a0a);font-size:14px;font-family:inherit;box-sizing:border-box}#mod-gate input:focus{outline:none;border-color:#C8A96E}#mod-gate input.err{border-color:#C0392B}#mod-gate .errmsg{display:none;color:#C0392B;font-size:12.5px;margin-top:8px}#mod-gate .errmsg.show{display:block}#mod-gate button{width:100%;margin-top:14px;padding:11px;background:#C8A96E;border:none;border-radius:6px;color:#0a0a0a;font-size:14px;font-weight:700;cursor:pointer}#mod-gate button:hover{background:#A8874E}#mod-gate button:disabled{opacity:.6;cursor:not-allowed}</style><div class="gc"><h2>Work Orders</h2><p>Enter the module password to continue.</p><label>Password</label><input id="mgpw" type="password" placeholder="Password"/><div class="errmsg" id="mgerr">Incorrect password.</div><button id="mgbtn" onclick="mgCheck()">Open</button></div>';
    document.body.parentNode.insertBefore(gate,document.body);
    document.getElementById('mgpw').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();mgCheck();}});
    document.getElementById('mgpw').addEventListener('input',function(){document.getElementById('mgerr').classList.remove('show');document.getElementById('mgpw').classList.remove('err');});
    setTimeout(function(){document.getElementById('mgpw').focus();},80);
  });
  window.mgCheck=function(){
    var pw=document.getElementById('mgpw').value;
    var btn=document.getElementById('mgbtn');btn.disabled=true;btn.textContent='Checking...';
    fetch('https://spfztpokbpomqtiqgggz.supabase.co/rest/v1/apm_settings?key=eq.mod_pass_workorders&select=value',{headers:{'apikey':'sb_publishable_xPXU0xL_YaiWA6k9PWc0Xg_4QYeypNi','Authorization':'Bearer sb_publishable_xPXU0xL_YaiWA6k9PWc0Xg_4QYeypNi'}})
    .then(function(r){return r.json();}).then(function(d){
      var correct=d&&d[0]&&d[0].value;
      if(correct&&pw===correct){document.getElementById('mod-gate').remove();document.body.style.display='';}
      else{document.getElementById('mgerr').classList.add('show');document.getElementById('mgpw').classList.add('err');document.getElementById('mgpw').value='';document.getElementById('mgpw').focus();btn.disabled=false;btn.textContent='Open';}
    }).catch(function(){document.getElementById('mgerr').textContent='Could not connect.';document.getElementById('mgerr').classList.add('show');btn.disabled=false;btn.textContent='Open';});
  };
})();
(function(){var t=localStorage.getItem('apm_theme')||'light';document.documentElement.setAttribute('data-theme',t);})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="apm-security.js"></script>

<style>
:root{--gold:#C8A96E;--gold-dk:#A8874E;--black:#0A0A0A;--bg:#FFFFFF;--bg1:#F5F5F5;--bg2:#EBEBEB;--border:#D8D8D8;--text:#0A0A0A;--text2:#444444;--text3:#888888;--shadow:rgba(0,0,0,.07)}
[data-theme="dark"]{--bg:#0A0A0A;--bg1:#141414;--bg2:#1E1E1E;--border:#2A2A2A;--text:#F0F0F0;--text2:#AAAAAA;--text3:#666666;--shadow:rgba(0,0,0,.35)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:56px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:40}
.topbar-left{display:flex;align-items:center;gap:16px}
.brand-link{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.brand-mark{width:30px;height:30px;border-radius:6px;background:var(--gold);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--black);flex:none}
.brand-name{font-size:14px;font-weight:700}
.page-label{font-size:13.5px;color:var(--text3);padding-left:16px;border-left:1px solid var(--border)}
.theme-btn{width:32px;height:32px;border-radius:6px;background:transparent;border:1px solid var(--border);color:var(--text2);display:grid;place-items:center}
.theme-btn:hover{border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;font-size:13.5px;font-weight:600;border:1px solid var(--border);background:var(--bg1);color:var(--text);cursor:pointer;transition:border-color .15s}
.btn:hover{border-color:var(--gold)}.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--black)}.btn-gold:hover{background:var(--gold-dk)}
.btn-danger{color:#C0392B;border-color:#C0392B33}.btn-sm{padding:6px 12px;font-size:12.5px}
.wrap{max-width:1200px;margin:0 auto;padding:28px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:22px}
.stat-cell{background:var(--bg);padding:18px 22px;border-right:1px solid var(--border)}.stat-cell:last-child{border-right:none}
.stat-lbl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.stat-val{font-size:20px;font-weight:700}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.search-input{padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg1);color:var(--text);font-size:13.5px;min-width:200px;flex:1;max-width:320px}
.search-input:focus{outline:none;border-color:var(--gold)}
.filter-tabs{display:flex;gap:2px;background:var(--bg1);border:1px solid var(--border);border-radius:6px;padding:3px}
.ftab{background:transparent;border:none;color:var(--text3);padding:6px 13px;border-radius:4px;font-size:13px;font-weight:500;cursor:pointer}
.ftab.active{background:var(--bg);color:var(--text);font-weight:600;box-shadow:0 1px 3px var(--shadow)}
.tbl-wrap{border:1px solid var(--border);border-radius:8px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{background:var(--bg1);padding:11px 16px;text-align:left;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border)}
tbody td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.rc{cursor:pointer}tbody tr.rc:hover{background:var(--bg1)}
.mono{font-variant-numeric:tabular-nums;font-size:13px}.dim{color:var(--text3);font-size:12.5px}
.badge{display:inline-block;padding:3px 9px;border-radius:4px;font-size:11.5px;font-weight:600;border:1px solid}
.progress{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;margin-top:5px}
.progress span{display:block;height:100%;border-radius:3px;background:var(--gold)}
.empty{padding:52px 20px;text-align:center;color:var(--text3);font-size:14px}.empty strong{display:block;color:var(--text);margin-bottom:4px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:5vh 16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--bg);border:1px solid var(--border);border-radius:10px;width:100%;max-width:700px;padding:28px;box-shadow:0 8px 32px var(--shadow)}
.modal h2{font-size:17px;font-weight:700;margin-bottom:20px}
.field{margin-bottom:14px}.field label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--bg1);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:9px 11px;font-size:14px;font-family:inherit}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:560px){.f2,.f3{grid-template-columns:1fr}}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;border-top:1px solid var(--border);padding-top:20px}
.mfl{margin-right:auto}
.jc-row{display:flex;align-items:center;gap:10px;padding:12px 16px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:var(--bg)}
.jc-row.done{border-color:#2D7D4644;background:rgba(45,125,70,.04)}
.jc-num{width:24px;height:24px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.jc-op{font-size:14px;font-weight:600;flex:1}
.jc-meta{font-size:12px;color:var(--text3)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid}
#toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:90}
.toast{background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:7px;padding:11px 16px;font-size:13.5px;min-width:220px;box-shadow:0 4px 16px var(--shadow);animation:tin .2s ease}
.toast.err{border-left-color:#C0392B}
@keyframes tin{from{transform:translateX(12px);opacity:0}}
.loading{padding:60px;text-align:center;color:var(--text3)}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <a class="brand-link" href="dashboard.html"><div class="brand-mark">AP</div><span class="brand-name">APM Metal Works</span></a>
    <span class="page-label">Work Orders</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <button class="theme-btn" onclick="toggleTheme()">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3.05 3.05l1.06 1.06M11.89 11.89l1.06 1.06M3.05 12.95l1.06-1.06M11.89 4.11l1.06-1.06"/></svg>
    </button>
    <button class="btn btn-gold btn-sm" onclick="openWO()">+ New work order</button>
  </div>
</header>

<div class="wrap">
  <div class="stats-row">
    <div class="stat-cell"><div class="stat-lbl">Total</div><div class="stat-val" id="stT">-</div></div>
    <div class="stat-cell"><div class="stat-lbl">In progress</div><div class="stat-val" id="stIP" style="color:var(--gold-dk)">-</div></div>
    <div class="stat-cell"><div class="stat-lbl">Quality check</div><div class="stat-val" id="stQC" style="color:#E67E22">-</div></div>
    <div class="stat-cell"><div class="stat-lbl">Completed</div><div class="stat-val" id="stC" style="color:#2D7D46">-</div></div>
    <div class="stat-cell"><div class="stat-lbl">Urgent</div><div class="stat-val" id="stU" style="color:#C0392B">-</div></div>
  </div>
  <div class="toolbar">
    <input class="search-input" id="search" placeholder="Search work orders..." oninput="renderList()">
    <div class="filter-tabs">
      <button class="ftab active" data-f="all" onclick="setF('all')">All</button>
      <button class="ftab" data-f="draft" onclick="setF('draft')">Draft</button>
      <button class="ftab" data-f="confirmed" onclick="setF('confirmed')">Confirmed</button>
      <button class="ftab" data-f="in_progress" onclick="setF('in_progress')">In progress</button>
      <button class="ftab" data-f="quality_check" onclick="setF('quality_check')">Quality check</button>
      <button class="ftab" data-f="completed" onclick="setF('completed')">Completed</button>
    </div>
  </div>
  <div id="listBody"><div class="loading">Loading...</div></div>
</div>

<div id="toasts"></div>

<script>
const SB_URL='https://spfztpokbpomqtiqgggz.supabase.co';
const SB_KEY='sb_publishable_xPXU0xL_YaiWA6k9PWc0Xg_4QYeypNi';
// Initialize with stored auth session so RLS blocks unauthenticated access
const _sess=JSON.parse(sessionStorage.getItem('apm_auth')||'{}');
const sb=supabase.createClient(SB_URL,SB_KEY,{
  global:{headers:{Authorization:'Bearer '+(_sess.access_token||SB_KEY)}},
  auth:{persistSession:false,autoRefreshToken:false}
});
const $=id=>document.getElementById(id);
const esc=s=>(s??'').toString().replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const num=v=>Number(v||0);
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'--';

function toggleTheme(){const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('apm_theme',n);}
function toast(m,e){const t=document.createElement('div');t.className='toast'+(e?' err':'');t.textContent=m;$('toasts').appendChild(t);setTimeout(()=>t.remove(),3800);}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModals();});

let workOrders=[],jobCards=[],projects=[],employees=[],acceptedQuotes=[],filt='all';

const ST={
  draft:        {l:'Draft',        c:'#888'},
  confirmed:    {l:'Confirmed',    c:'#C8A96E'},
  in_progress:  {l:'In Progress',  c:'#2D7D46'},
  quality_check:{l:'Quality Check',c:'#E67E22'},
  completed:    {l:'Completed',    c:'#2D7D46'},
  cancelled:    {l:'Cancelled',    c:'#C0392B'},
};
const PR={low:'Low',normal:'Normal',high:'High',urgent:'Urgent'};
const PR_C={low:'#888',normal:'var(--text)',high:'#C8A96E',urgent:'#C0392B'};

const DEFAULT_OPS=['Cut steel','Weld','Grind / sand','Fabricate','Prime','Powder coat / paint','Quality check','Pack & deliver'];

async function loadAll(){
  const[woR,jcR,pR,eR,qR]=await Promise.all([
    sb.from('apm_work_orders').select('*').order('created_at',{ascending:false}),
    sb.from('apm_job_cards').select('*').order('sort_order'),
    sb.from('apm_projects').select('id,name,client').order('name'),
    sb.from('employees').select('id,name,role').eq('status','active').order('name'),
    sb.from('quotes').select('id,quote_no,client_name').eq('status','accepted').order('created_at',{ascending:false}),
  ]);
  if(woR.error){$('listBody').innerHTML='<div class="tbl-wrap"><div class="empty"><strong>Could not load</strong>Run workorder_quality_setup.sql in Supabase first.</div></div>';toast(woR.error.message,1);return;}
  workOrders=woR.data||[];jobCards=jcR.data||[];projects=pR.data||[];employees=eR.data||[];acceptedQuotes=qR.data||[];
  renderStats();renderList();
}

function renderStats(){
  $('stT').textContent=workOrders.length;
  $('stIP').textContent=workOrders.filter(w=>w.status==='in_progress').length;
  $('stQC').textContent=workOrders.filter(w=>w.status==='quality_check').length;
  $('stC').textContent=workOrders.filter(w=>w.status==='completed').length;
  $('stU').textContent=workOrders.filter(w=>w.priority==='urgent').length;
}

function setF(f){filt=f;document.querySelectorAll('.ftab').forEach(t=>t.classList.toggle('active',t.dataset.f===f));renderList();}

function renderList(){
  let list=workOrders.slice();
  if(filt!=='all')list=list.filter(w=>w.status===filt);
  const q=$('search').value.trim().toLowerCase();
  if(q)list=list.filter(w=>[w.wo_no,w.title,w.description].some(v=>(v||'').toLowerCase().includes(q)));
  if(!list.length){$('listBody').innerHTML='<div class="tbl-wrap"><div class="empty"><strong>No work orders</strong>Create a work order to track the production of a job from start to finish.</div></div>';return;}

  const rows=list.map(w=>{
    const proj=projects.find(p=>p.id===w.project_id);
    const wjc=jobCards.filter(j=>j.work_order_id===w.id);
    const done=wjc.filter(j=>j.status==='done').length;
    const pct=wjc.length?Math.round(done/wjc.length*100):0;
    const st=ST[w.status]||ST.draft;
    const overdue=w.planned_end&&w.planned_end<today()&&!['completed','cancelled'].includes(w.status);
    return`<tr class="rc" onclick="openWO('${w.id}')">
      <td class="mono"><strong>${esc(w.wo_no||'--')}</strong>${overdue?'<div class="dim" style="color:#C0392B;font-size:11.5px">Overdue</div>':''}</td>
      <td><strong>${esc(w.title)}</strong>${proj?'<div class="dim">'+esc(proj.name+(proj.client?' - '+proj.client:''))+'</div>':''}</td>
      <td><span style="color:${PR_C[w.priority||'normal']};font-size:12.5px;font-weight:600">${PR[w.priority||'normal']}</span></td>
      <td>
        ${wjc.length?`<div style="font-size:12px;color:var(--text3);margin-bottom:3px">${done}/${wjc.length} tasks</div><div class="progress"><span style="width:${pct}%"></span></div>`:'<span class="dim">No tasks</span>'}
      </td>
      <td class="mono dim">${fmtDate(w.planned_end)}</td>
      <td><span class="badge" style="color:${st.c};border-color:${st.c}44">${st.l}</span></td>
    </tr>`;
  }).join('');

  $('listBody').innerHTML=`<div class="tbl-wrap"><table>
    <thead><tr><th>WO No.</th><th>Title / Project</th><th>Priority</th><th>Progress</th><th>Due date</th><th>Status</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

// -- Work Order modal ----------------------------------------------
function nextWONo(){
  const y=new Date().getFullYear(),p=`APM-WO-${y}-`;
  const nums=workOrders.map(x=>x.wo_no).filter(n=>n&&n.startsWith(p)).map(n=>parseInt(n.slice(p.length),10)).filter(n=>!isNaN(n));
  return p+String((nums.length?Math.max(...nums):0)+1).padStart(3,'0');
}

function openWO(id){
  const w=id?workOrders.find(x=>x.id===id):null;
  const wjc=w?jobCards.filter(j=>j.work_order_id===w.id).sort((a,b)=>a.sort_order-b.sort_order):[];
  const projOpts='<option value="">-- No project --</option>'+projects.map(p=>`<option value="${p.id}" ${w?.project_id===p.id?'selected':''}>${esc(p.name)}</option>`).join('');
  const quoteOpts='<option value="">-- No quote --</option>'+acceptedQuotes.map(q=>`<option value="${q.id}" ${w?.quote_id===q.id?'selected':''}>${esc(q.quote_no)} - ${esc(q.client_name||'')}</option>`).join('');

  const modal=document.createElement('div');
  modal.className='overlay open';modal.id='woOverlayEl';
  modal.innerHTML=`<div class="modal" style="max-width:740px">
    <h2>${w?'Work Order '+esc(w.wo_no||''):'New Work Order'}</h2>
    <input type="hidden" id="woId" value="${w?.id||''}">
    <div class="f2">
      <div class="field"><label>Title</label><input id="woTitle" value="${esc(w?.title||'')}" placeholder="e.g. Gate fabrication for Al-Rashidi"></div>
      <div class="field"><label>Project</label><select id="woProject">${projOpts}</select></div>
    </div>
    <div class="f2">
      <div class="field"><label>Status</label>
        <select id="woStatus">
          ${Object.entries(ST).map(([v,s])=>`<option value="${v}" ${(w?.status||'draft')===v?'selected':''}>${s.l}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Priority</label>
        <select id="woPriority">
          <option value="low" ${w?.priority==='low'?'selected':''}>Low</option>
          <option value="normal" ${(!w||w?.priority==='normal')?'selected':''}>Normal</option>
          <option value="high" ${w?.priority==='high'?'selected':''}>High</option>
          <option value="urgent" ${w?.priority==='urgent'?'selected':''}>Urgent</option>
        </select>
      </div>
    </div>
    <div class="f2">
      <div class="field"><label>Planned start</label><input id="woStart" type="date" value="${w?.planned_start||''}"></div>
      <div class="field"><label>Planned end / deadline</label><input id="woEnd" type="date" value="${w?.planned_end||''}"></div>
    </div>
    <div class="f2">
      <div class="field"><label>Customer delivery date</label><input id="woDelivery" type="date" value="${w?.delivery_date||''}"></div>
      <div class="field"><label>Linked quote</label><select id="woQuote">${quoteOpts}</select></div>
    </div>
    <div class="field"><label>Scope / description (client-facing)</label><textarea id="woDesc" rows="2" style="resize:vertical;width:100%;background:var(--bg1);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:9px 11px;font-size:14px;font-family:inherit">${esc(w?.description||'')}</textarea></div>
    <div class="field"><label>Internal notes</label><textarea id="woIntNotes" rows="2" style="resize:vertical;width:100%;background:var(--bg1);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:9px 11px;font-size:14px;font-family:inherit">${esc(w?.internal_notes||'')}</textarea></div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px">
      <div style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)">Job cards / tasks</div>
      <button class="btn btn-sm" onclick="addJCRow()">+ Add task</button>
    </div>
    <div id="jcList">${wjc.length?wjc.map((j,i)=>jcRowHTML(j,i)).join(''):
      '<div class="dim" style="padding:12px 0;font-size:13px">No tasks yet. Add tasks below or use quick-add.</div>'}</div>
    ${!wjc.length?`<div style="margin-bottom:16px"><div style="font-size:12px;color:var(--text3);margin-bottom:8px">Quick add standard metalwork tasks:</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${DEFAULT_OPS.map(op=>`<button class="btn btn-sm" style="font-size:12px;padding:4px 10px" onclick="quickAddOp('${esc(op)}')">${esc(op)}</button>`).join('')}</div>
    </div>`:''}

    <div class="modal-foot">
      ${w?'<button class="btn btn-danger btn-sm mfl" id="woDelBtn">Delete</button>':''}
      <button class="btn btn-sm" onclick="closeModals()">Cancel</button>
      <button class="btn btn-gold btn-sm" onclick="saveWO()">Save</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click',e=>{if(e.target===modal)closeModals();});
  const delBtn=modal.querySelector('#woDelBtn');
  if(delBtn&&id)delBtn.onclick=()=>deleteWO(id);
}

let tempJCs=[];
function jcRowHTML(j,i){
  const empOpts='<option value="">-- Assign --</option>'+employees.map(e=>`<option value="${e.id}" ${j.employee_id===e.id?'selected':''}>${esc(e.name)}</option>`).join('');
  const stBadge={pending:'color:#888',in_progress:'color:#C8A96E',done:'color:#2D7D46',skipped:'color:#aaa'};
  return`<div class="jc-row ${j.status==='done'?'done':''}" id="jcrow_${j.id||'new'+i}">
    <div class="jc-num">${i+1}</div>
    <div style="flex:1">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <input value="${esc(j.operation||'')}" placeholder="Operation name" style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:5px 8px;font-size:13px;font-family:inherit" data-jcid="${j.id||''}" data-field="operation">
        <select style="background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:5px 8px;font-size:12px;font-family:inherit" data-jcid="${j.id||''}" data-field="status" onchange="updateJCStatus(this,'${j.id||''}')">
          <option value="pending" ${j.status==='pending'?'selected':''}>Pending</option>
          <option value="in_progress" ${j.status==='in_progress'?'selected':''}>In progress</option>
          <option value="done" ${j.status==='done'?'selected':''}>Done</option>
          <option value="skipped" ${j.status==='skipped'?'selected':''}>Skip</option>
        </select>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <select style="background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:4px 8px;font-size:12px;font-family:inherit;flex:1" data-jcid="${j.id||''}" data-field="employee_id">${empOpts}</select>
        <input type="number" value="${j.planned_hours||''}" placeholder="Est. hrs" min="0" step="0.5" style="width:80px;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:4px 8px;font-size:12px;font-family:inherit" data-jcid="${j.id||''}" data-field="planned_hours">
        <input value="${esc(j.note||'')}" placeholder="Note" style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:4px 8px;font-size:12px;font-family:inherit" data-jcid="${j.id||''}" data-field="note">
      </div>
    </div>
  </div>`;
}

function addJCRow(){
  const list=document.getElementById('jcList');if(!list)return;
  const i=list.querySelectorAll('.jc-row').length;
  const newJ={id:'',operation:'',status:'pending',employee_id:'',planned_hours:'',note:''};
  const div=document.createElement('div');
  div.innerHTML=jcRowHTML(newJ,i);
  // Remove the "no tasks" message if present
  const noTasksMsg=list.querySelector('.dim');if(noTasksMsg)noTasksMsg.remove();
  list.appendChild(div.firstChild);
}

function quickAddOp(op){
  const list=document.getElementById('jcList');if(!list)return;
  const noMsg=list.querySelector('.dim');if(noMsg)noMsg.remove();
  const i=list.querySelectorAll('.jc-row').length;
  const div=document.createElement('div');
  div.innerHTML=jcRowHTML({id:'',operation:op,status:'pending',employee_id:'',planned_hours:'',note:''},i);
  list.appendChild(div.firstChild);
}

async function updateJCStatus(sel,jcId){
  if(!jcId)return;
  const{error}=await sb.from('apm_job_cards').update({status:sel.value}).eq('id',jcId);
  if(error){toast(error.message,1);return;}
  const row=sel.closest('.jc-row');
  if(row)row.classList.toggle('done',sel.value==='done');
  // Update local state
  const jc=jobCards.find(j=>j.id===jcId);if(jc)jc.status=sel.value;
  renderList();toast('Task updated');
}

function readJCRows(){
  const list=document.getElementById('jcList');if(!list)return[];
  return Array.from(list.querySelectorAll('.jc-row')).map((row,i)=>{
    const inputs=row.querySelectorAll('input,select');
    if(!inputs.length)return null;
    return{
      id:inputs[0].dataset.jcid||'',
      operation:inputs[0].value.trim(),
      status:inputs[1].value,
      employee_id:inputs[2].value||null,
      planned_hours:num(inputs[3].value)||null,
      note:inputs[4].value.trim()||null,
      sort_order:i,
    };
  }).filter(j=>j&&j.operation);
}

async function saveWO(){
  const title=$('woTitle')?.value.trim();if(!title)return toast('Title required',1);
  const id=$('woId')?.value;
  const rec={
    title,
    project_id:$('woProject')?.value||null,
    quote_id:$('woQuote')?.value||null,
    status:$('woStatus')?.value||'draft',
    priority:$('woPriority')?.value||'normal',
    planned_start:$('woStart')?.value||null,
    planned_end:$('woEnd')?.value||null,
    delivery_date:$('woDelivery')?.value||null,
    description:$('woDesc')?.value.trim()||null,
    internal_notes:$('woIntNotes')?.value.trim()||null,
  };
  if(!id)rec.wo_no=nextWONo();

  let woId=id;
  if(id){
    const{error}=await sb.from('apm_work_orders').update(rec).eq('id',id);
    if(error)return toast(error.message,1);
  }else{
    const{data,error}=await sb.from('apm_work_orders').insert(rec).select();
    if(error)return toast(error.message,1);
    woId=data[0].id;
  }

  // Save job cards
  const jcs=readJCRows();
  const existingIds=jcs.map(j=>j.id).filter(Boolean);
  // Delete removed cards
  if(id){
    const oldIds=jobCards.filter(j=>j.work_order_id===id).map(j=>j.id);
    const toDelete=oldIds.filter(oid=>!existingIds.includes(oid));
    if(toDelete.length)await sb.from('apm_job_cards').delete().in('id',toDelete);
  }
  // Upsert each card
  for(const jc of jcs){
    const jrec={work_order_id:woId,operation:jc.operation,status:jc.status,employee_id:jc.employee_id,employee_name:employees.find(e=>e.id===jc.employee_id)?.name||null,planned_hours:jc.planned_hours,note:jc.note,sort_order:jc.sort_order};
    if(jc.id){await sb.from('apm_job_cards').update(jrec).eq('id',jc.id);}
    else{await sb.from('apm_job_cards').insert(jrec);}
  }

  closeModals();toast(id?'Work order updated':'Work order created');loadAll();
APM_SEC.init('Work Orders');

async function deleteWO(id){
  if(!confirm('Delete this work order?'))return;
  const{error}=await sb.from('apm_work_orders').delete().eq('id',id);
  if(error)return toast(error.message,1);
  closeModals();toast('Deleted');loadAll();
}

function closeModals(){document.querySelectorAll('.overlay').forEach(o=>{if(o.id==='woOverlayEl')o.remove();else o.classList.remove('open');});}
