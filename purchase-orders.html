<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purchase Orders -- APM Metal Works</title>
<script>
(function(){
  var K='apm_auth',T=10*60*60*1000;
  try{var s=JSON.parse(sessionStorage.getItem(K));if(!s||Date.now()-s.ts>T)throw 0;}
  catch(e){window.location.href='login.html';return;}
  var MK='apm_mod_po',PASS='po2024';
  if(!sessionStorage.getItem(MK)){
    document.addEventListener('DOMContentLoaded',function(){
      document.body.style.display='none';
      var gate=document.createElement('div');gate.id='mod-gate';
      gate.innerHTML='<style>'
        +'#mod-gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;'
        +'background:var(--bg,#fff);z-index:9999;font-family:inherit}'
        +'#mod-gate .gc{width:100%;max-width:360px;padding:24px;border:1px solid var(--border,#d8d8d8);'
        +'border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.08)}'
        +'#mod-gate h2{font-size:17px;font-weight:700;margin-bottom:4px}'
        +'#mod-gate p{font-size:13px;color:var(--text3,#888);margin-bottom:20px}'
        +'#mod-gate label{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;'
        +'text-transform:uppercase;color:var(--text3,#888);margin-bottom:7px}'
        +'#mod-gate input{width:100%;padding:11px 13px;border:1px solid var(--border,#d8d8d8);'
        +'border-radius:6px;background:var(--bg1,#f5f5f5);color:var(--text,#0a0a0a);'
        +'font-size:14px;font-family:inherit;box-sizing:border-box}'
        +'#mod-gate input:focus{outline:none;border-color:#C8A96E}'
        +'#mod-gate input.err{border-color:#C0392B}'
        +'#mod-gate .errmsg{display:none;color:#C0392B;font-size:12.5px;margin-top:8px}'
        +'#mod-gate .errmsg.show{display:block}'
        +'#mod-gate button{width:100%;margin-top:14px;padding:11px;background:#C8A96E;'
        +'border:none;border-radius:6px;color:#0a0a0a;font-size:14px;font-weight:700;cursor:pointer}'
        +'#mod-gate button:hover{background:#A8874E}'
        +'</style>'
        +'<div class="gc"><h2>Purchase Orders</h2>'
        +'<p>Enter the module password to continue.</p>'
        +'<label>Password</label>'
        +'<input id="mgpw" type="password" placeholder="Password" />'
        +'<div class="errmsg" id="mgerr">Incorrect password.</div>'
        +'<button onclick="mgCheck()">Open</button></div>';
      document.body.parentNode.insertBefore(gate,document.body);
      document.getElementById('mgpw').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();mgCheck();}});
      document.getElementById('mgpw').addEventListener('input',function(){document.getElementById('mgerr').classList.remove('show');document.getElementById('mgpw').classList.remove('err');});
      setTimeout(function(){document.getElementById('mgpw').focus();},80);
    });
  }
  window.mgCheck=function(){
    var pw=document.getElementById('mgpw').value;
    if(pw===PASS){sessionStorage.setItem(MK,'1');document.getElementById('mod-gate').remove();document.body.style.display='';}
    else{document.getElementById('mgerr').classList.add('show');document.getElementById('mgpw').classList.add('err');document.getElementById('mgpw').value='';document.getElementById('mgpw').focus();}
  };
})();
(function(){var t=localStorage.getItem('apm_theme')||'light';document.documentElement.setAttribute('data-theme',t);})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#C8A96E;--gold-dk:#A8874E;--black:#0A0A0A;--bg:#FFFFFF;--bg1:#F5F5F5;--bg2:#EBEBEB;--border:#D8D8D8;--text:#0A0A0A;--text2:#444444;--text3:#888888;--shadow:rgba(0,0,0,.07)}
[data-theme="dark"]{--bg:#0A0A0A;--bg1:#141414;--bg2:#1E1E1E;--border:#2A2A2A;--text:#F0F0F0;--text2:#AAAAAA;--text3:#666666;--shadow:rgba(0,0,0,.35)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button{font-family:inherit;cursor:pointer}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:56px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:40}
.topbar-left{display:flex;align-items:center;gap:16px}
.brand-link{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.brand-mark{width:30px;height:30px;border-radius:6px;background:var(--gold);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--black);flex:none}
.brand-name{font-size:14px;font-weight:700}
.page-label{font-size:13.5px;color:var(--text3);padding-left:16px;border-left:1px solid var(--border)}
.topbar-right{display:flex;align-items:center;gap:10px}
.theme-btn{width:32px;height:32px;border-radius:6px;background:transparent;border:1px solid var(--border);color:var(--text2);display:grid;place-items:center}
.theme-btn:hover{border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;font-size:13.5px;font-weight:600;border:1px solid var(--border);background:var(--bg1);color:var(--text);cursor:pointer;transition:border-color .15s}
.btn:hover{border-color:var(--gold)}.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--black)}.btn-gold:hover{background:var(--gold-dk);border-color:var(--gold-dk)}
.btn-danger{color:#C0392B;border-color:#C0392B33}.btn-danger:hover{border-color:#C0392B}.btn-sm{padding:6px 12px;font-size:12.5px}
.wrap{max-width:1200px;margin:0 auto;padding:28px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:22px}
.stat-cell{background:var(--bg);padding:18px 22px;border-right:1px solid var(--border)}.stat-cell:last-child{border-right:none}
.stat-lbl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.stat-val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}.gold{color:var(--gold-dk)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.search-input{padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg1);color:var(--text);font-size:13.5px;min-width:200px;flex:1;max-width:300px}
.search-input:focus{outline:none;border-color:var(--gold)}
.filter-tabs{display:flex;gap:2px;background:var(--bg1);border:1px solid var(--border);border-radius:6px;padding:3px}
.ftab{background:transparent;border:none;color:var(--text3);padding:6px 13px;border-radius:4px;font-size:13px;font-weight:500;cursor:pointer}
.ftab.active{background:var(--bg);color:var(--text);font-weight:600;box-shadow:0 1px 3px var(--shadow)}
.tbl-wrap{border:1px solid var(--border);border-radius:8px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{background:var(--bg1);padding:11px 16px;text-align:left;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.rc{cursor:pointer}tbody tr.rc:hover{background:var(--bg1)}
.mono{font-variant-numeric:tabular-nums;font-size:13px}.dim{color:var(--text3);font-size:12.5px}.right{text-align:right}
.badge{display:inline-block;padding:3px 9px;border-radius:4px;font-size:11.5px;font-weight:600;border:1px solid}
.empty{padding:52px 20px;text-align:center;color:var(--text3);font-size:14px}.empty strong{display:block;color:var(--text);margin-bottom:4px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:5vh 16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--bg);border:1px solid var(--border);border-radius:10px;width:100%;max-width:660px;padding:28px;box-shadow:0 8px 32px var(--shadow)}
.modal h2{font-size:17px;font-weight:700;margin-bottom:20px}
.field{margin-bottom:14px}.field label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--bg1);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:9px 11px;font-size:14px;font-family:inherit}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:560px){.f2,.f3{grid-template-columns:1fr}}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;border-top:1px solid var(--border);padding-top:20px}
.mfl{margin-right:auto}
.items-tbl{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px}
.items-tbl th{background:var(--bg1);padding:8px 10px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border)}
.items-tbl td{padding:7px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
.items-tbl input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:6px 8px;font-size:13px;font-family:inherit}
.items-tbl input:focus{outline:none;border-color:var(--gold)}
.sum-box{background:var(--bg1);border:1px solid var(--border);border-radius:7px;padding:14px 16px;margin-bottom:16px}
.sum-row{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0}
.sum-row.tot{font-weight:700;font-size:15px;border-top:1px solid var(--border);padding-top:10px;margin-top:6px}
#toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:90}
.toast{background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:7px;padding:11px 16px;font-size:13.5px;min-width:220px;box-shadow:0 4px 16px var(--shadow);animation:tin .2s ease}
.toast.err{border-left-color:#C0392B}
@keyframes tin{from{transform:translateX(12px);opacity:0}}
.loading{padding:60px;text-align:center;color:var(--text3)}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <a class="brand-link" href="dashboard.html"><div class="brand-mark">AP</div><span class="brand-name">APM Metal Works</span></a>
    <span class="page-label">Purchase Orders (PO)</span>
  </div>
  <div class="topbar-right">
    <button class="theme-btn" onclick="toggleTheme()">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3.05 3.05l1.06 1.06M11.89 11.89l1.06 1.06M3.05 12.95l1.06-1.06M11.89 4.11l1.06-1.06"/></svg>
    </button>
    <button class="btn btn-gold btn-sm" onclick="openPO()">+ New PO</button>
  </div>
</header>

<div class="wrap">
  <div class="stats-row">
    <div class="stat-cell"><div class="stat-lbl">Total POs</div><div class="stat-val" id="stT">-</div></div>
    <div class="stat-cell"><div class="stat-lbl">Draft</div><div class="stat-val" id="stD">-</div></div>
    <div class="stat-cell"><div class="stat-lbl">Pending delivery</div><div class="stat-val" id="stPD">-</div></div>
    <div class="stat-cell"><div class="stat-lbl">Received</div><div class="stat-val gold" id="stR">-</div></div>
    <div class="stat-cell"><div class="stat-lbl">Total value</div><div class="stat-val gold" id="stV">-</div></div>
  </div>
  <div class="toolbar">
    <input class="search-input" id="search" placeholder="Search PO, supplier, project..." oninput="renderList()">
    <div class="filter-tabs">
      <button class="ftab active" data-f="all" onclick="setF('all')">All</button>
      <button class="ftab" data-f="draft" onclick="setF('draft')">Draft</button>
      <button class="ftab" data-f="sent" onclick="setF('sent')">Sent</button>
      <button class="ftab" data-f="received" onclick="setF('received')">Received</button>
      <button class="ftab" data-f="cancelled" onclick="setF('cancelled')">Cancelled</button>
    </div>
  </div>
  <div id="listBody"><div class="loading">Loading...</div></div>
</div>

<!-- PO editor -->
<div class="overlay" id="poOverlay">
  <div class="modal">
    <h2 id="poTitle">New Purchase Order</h2>
    <input type="hidden" id="poId">
    <div class="f2">
      <div class="field"><label>Supplier</label><select id="poSupplier" onchange="onSupplierChange()"></select></div>
      <div class="field"><label>Project (optional)</label><select id="poProject"></select></div>
    </div>
    <div class="f2">
      <div class="field"><label>Issue date</label><input id="poDate" type="date"></div>
      <div class="field"><label>Expected delivery</label><input id="poDel" type="date"></div>
    </div>
    <div class="f2">
      <div class="field"><label>Status</label>
        <select id="poStatus">
          <option value="draft">Draft</option>
          <option value="sent">Sent to supplier</option>
          <option value="acknowledged">Acknowledged</option>
          <option value="partial">Partial delivery</option>
          <option value="received">Fully received</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div class="field"><label>Note</label><input id="poNote" placeholder="optional"></div>
    </div>

    <div style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:10px">Line items</div>
    <table class="items-tbl" id="itemsTbl">
      <thead><tr><th style="width:36%">Description</th><th>Qty</th><th>Unit</th><th>Rate (SAR)</th><th>Amount</th><th style="width:32px"></th></tr></thead>
      <tbody id="itemsBody"></tbody>
    </table>
    <button class="btn btn-sm" style="margin-bottom:16px" onclick="addLine()">+ Add line</button>

    <div class="sum-box">
      <div class="sum-row"><span>Subtotal</span><span class="mono" id="poSub">SAR 0</span></div>
      <div class="sum-row"><span>VAT 15%</span><span class="mono" id="poVat">SAR 0</span></div>
      <div class="sum-row tot"><span>Total</span><span class="mono" id="poTot">SAR 0</span></div>
    </div>

    <div class="modal-foot">
      <button class="btn btn-danger btn-sm mfl" id="poDel2" style="display:none" onclick="deletePO()">Delete</button>
      <button class="btn btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-sm" onclick="printPO()">Print / PDF</button>
      <button class="btn btn-gold btn-sm" onclick="savePO()">Save PO</button>
    </div>
  </div>
</div>

<div id="toasts"></div>
<script>
const SB_URL='https://spfztpokbpomqtiqgggz.supabase.co';
const SB_KEY='sb_publishable_xPXU0xL_YaiWA6k9PWc0Xg_4QYeypNi';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=s=>(s??'').toString().replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const fmtSAR=n=>'SAR '+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
const fmtDate=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'--';
const today=()=>new Date().toISOString().slice(0,10);
const num=v=>Number(v||0);

let pos=[],suppliers=[],projects=[],filt='all';

const ST={
  draft:      {label:'Draft',       color:'#888'},
  sent:       {label:'Sent',        color:'#C8A96E'},
  acknowledged:{label:'Acknowledged',color:'#A8874E'},
  partial:    {label:'Partial',     color:'#C8A96E'},
  received:   {label:'Received',    color:'#2D7D46'},
  cancelled:  {label:'Cancelled',   color:'#C0392B'},
};

function toggleTheme(){const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('apm_theme',n);}
function toast(m,e){const t=document.createElement('div');t.className='toast'+(e?' err':'');t.textContent=m;$('toasts').appendChild(t);setTimeout(()=>t.remove(),3800);}
function closeModal(){$('poOverlay').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
$('poOverlay').addEventListener('click',e=>{if(e.target===$('poOverlay'))closeModal();});

async function loadAll(){
  const[poR,sR,pR]=await Promise.all([
    sb.from('apm_purchase_orders').select('*').order('created_at',{ascending:false}),
    sb.from('apm_suppliers').select('id,name,category').order('name'),
    sb.from('apm_projects').select('id,name,client').order('name'),
  ]);
  if(poR.error){$('listBody').innerHTML='<div class="tbl-wrap"><div class="empty"><strong>Could not load</strong>Run po_setup.sql in Supabase first.</div></div>';toast(poR.error.message,1);return;}
  pos=poR.data||[];suppliers=sR.data||[];projects=pR.data||[];
  renderStats();renderList();
}

function renderStats(){
  $('stT').textContent=pos.length;
  $('stD').textContent=pos.filter(p=>p.status==='draft').length;
  $('stPD').textContent=pos.filter(p=>['sent','acknowledged','partial'].includes(p.status)).length;
  $('stR').textContent=pos.filter(p=>p.status==='received').length;
  $('stV').textContent=fmtSAR(pos.filter(p=>p.status!=='cancelled').reduce((s,p)=>s+num(p.total),0));
}

function setF(f){filt=f;document.querySelectorAll('.ftab').forEach(t=>t.classList.toggle('active',t.dataset.f===f));renderList();}

function renderList(){
  let list=pos.slice();
  if(filt!=='all')list=list.filter(p=>p.status===filt);
  const q=$('search').value.trim().toLowerCase();
  if(q)list=list.filter(p=>[p.po_no,p.supplier_name,p.note].some(v=>(v||'').toLowerCase().includes(q)));
  if(!list.length){$('listBody').innerHTML='<div class="tbl-wrap"><div class="empty"><strong>No purchase orders</strong>Raise a PO to formally request materials from a supplier.</div></div>';return;}
  const rows=list.map(p=>{
    const s=ST[p.status]||ST.draft;
    const proj=projects.find(x=>x.id===p.project_id);
    const items=(p.items||[]).length;
    return`<tr class="rc" onclick="openPO('${p.id}')">
      <td class="mono"><strong>${esc(p.po_no||'--')}</strong></td>
      <td><strong>${esc(p.supplier_name||'--')}</strong>${proj?'<div class="dim">'+esc(proj.name)+'</div>':''}</td>
      <td class="dim">${items} item${items!==1?'s':''}</td>
      <td class="mono dim">${fmtDate(p.issue_date)}</td>
      <td class="mono dim">${fmtDate(p.delivery_date)}</td>
      <td class="mono">${fmtSAR(p.total)}</td>
      <td><span class="badge" style="color:${s.color};border-color:${s.color}44">${s.label}</span></td>
    </tr>`;
  }).join('');
  $('listBody').innerHTML=`<div class="tbl-wrap"><table>
    <thead><tr><th>PO No.</th><th>Supplier / Project</th><th>Items</th><th>Issued</th><th>Delivery</th><th>Total</th><th>Status</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

// -- PO editor --
let lines=[];

function nextPONo(){
  const y=new Date().getFullYear(),p=`APM-PO-${y}-`;
  const nums=pos.map(x=>x.po_no).filter(n=>n&&n.startsWith(p)).map(n=>parseInt(n.slice(p.length),10)).filter(n=>!isNaN(n));
  return p+String((nums.length?Math.max(...nums):0)+1).padStart(3,'0');
}

function openPO(id){
  const po=id?pos.find(x=>x.id===id):null;
  $('poTitle').textContent=po?'Purchase Order '+esc(po.po_no||''):'New Purchase Order';
  $('poId').value=po?.id||'';
  $('poSupplier').innerHTML='<option value="">-- Select supplier --</option>'+suppliers.map(s=>`<option value="${s.id}" data-name="${esc(s.name)}">${esc(s.name)}</option>`).join('');
  $('poProject').innerHTML='<option value="">-- No project --</option>'+projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  $('poSupplier').value=po?.supplier_id||'';
  $('poProject').value=po?.project_id||'';
  $('poDate').value=po?.issue_date||today();
  const del=new Date();del.setDate(del.getDate()+14);
  $('poDel').value=po?.delivery_date||del.toISOString().slice(0,10);
  $('poStatus').value=po?.status||'draft';
  $('poNote').value=po?.note||'';
  $('poDel2').style.display=po?'':'none';
  lines=po?.items?JSON.parse(JSON.stringify(po.items)):[];
  if(!lines.length)lines=[{desc:'',qty:1,unit:'',rate:'',amount:0}];
  renderLines();
  $('poOverlay').classList.add('open');
}

function onSupplierChange(){
  const sel=$('poSupplier').options[$('poSupplier').selectedIndex];
  // store name for display
}

function renderLines(){
  $('itemsBody').innerHTML=lines.map((l,i)=>`<tr>
    <td><input value="${esc(l.desc||'')}" placeholder="Material description" oninput="lines[${i}].desc=this.value"></td>
    <td><input type="number" value="${l.qty||''}" min="0" step="any" style="width:70px" oninput="lines[${i}].qty=+this.value;calcLine(${i})"></td>
    <td><input value="${esc(l.unit||'')}" placeholder="pcs" style="width:60px" oninput="lines[${i}].unit=this.value"></td>
    <td><input type="number" value="${l.rate||''}" min="0" step="any" style="width:100px" oninput="lines[${i}].rate=+this.value;calcLine(${i})"></td>
    <td class="mono right">${fmtSAR(l.amount||0)}</td>
    <td><button onclick="removeLine(${i})" style="background:none;border:none;color:var(--text3);font-size:16px;cursor:pointer;padding:0 4px">&times;</button></td>
  </tr>`).join('');
  calcTotals();
}

function calcLine(i){
  lines[i].amount=num(lines[i].qty)*num(lines[i].rate);
  calcTotals();
  // update amount cell
  const rows=$('itemsBody').querySelectorAll('tr');
  if(rows[i])rows[i].querySelectorAll('td')[4].textContent=fmtSAR(lines[i].amount);
}

function calcTotals(){
  const sub=lines.reduce((s,l)=>s+num(l.amount),0);
  const vat=sub*0.15;
  $('poSub').textContent=fmtSAR(sub);
  $('poVat').textContent=fmtSAR(vat);
  $('poTot').textContent=fmtSAR(sub+vat);
}

function addLine(){lines.push({desc:'',qty:1,unit:'',rate:'',amount:0});renderLines();}
function removeLine(i){if(lines.length===1)return toast('Need at least one line',1);lines.splice(i,1);renderLines();}

async function savePO(){
  const supId=$('poSupplier').value;
  const sup=suppliers.find(s=>s.id===supId);
  if(!sup)return toast('Select a supplier',1);
  if(!lines.some(l=>l.desc.trim()))return toast('Add at least one item',1);
  const sub=lines.reduce((s,l)=>s+num(l.amount),0),vat=sub*.15;
  const id=$('poId').value;
  const rec={
    supplier_id:supId,supplier_name:sup.name,
    project_id:$('poProject').value||null,
    issue_date:$('poDate').value||today(),
    delivery_date:$('poDel').value||null,
    status:$('poStatus').value,
    items:lines,subtotal:sub,vat,total:sub+vat,
    note:$('poNote').value.trim()||null,
  };
  if(!id)rec.po_no=nextPONo();
  const{error}=await(id?sb.from('apm_purchase_orders').update(rec).eq('id',id):sb.from('apm_purchase_orders').insert(rec));
  if(error)return toast(error.message,1);
  closeModal();toast(id?'PO updated':'PO created');loadAll();
}

async function deletePO(){
  const id=$('poId').value;if(!id||!confirm('Delete this PO?'))return;
  const{error}=await sb.from('apm_purchase_orders').delete().eq('id',id);
  if(error)return toast(error.message,1);
  closeModal();toast('Deleted');loadAll();
}

function printPO(){
  const id=$('poId').value;
  const po=id?pos.find(x=>x.id===id):null;
  const sup=$('poSupplier').options[$('poSupplier').selectedIndex]?.text||'--';
  const proj=projects.find(x=>x.id===$('poProject').value);
  const sub=lines.reduce((s,l)=>s+num(l.amount),0),vat=sub*.15;
  const itemRows=lines.filter(l=>l.desc).map(l=>
    '<tr><td>'+esc(l.desc)+'</td><td style="text-align:center">'+num(l.qty)+' '+esc(l.unit||'')+'</td>'
    +'<td style="text-align:right">SAR '+num(l.rate).toLocaleString()+'</td>'
    +'<td style="text-align:right">SAR '+num(l.amount).toLocaleString()+'</td></tr>'
  ).join('');
  const w=window.open('','_blank');
  w.document.write('<!DOCTYPE html><html><head><title>PO '+(po?.po_no||'Draft')+'</title>'
    +'<style>body{font-family:Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 24px;color:#111}'
    +'h1{font-size:18px;border-bottom:2px solid #C8A96E;padding-bottom:10px;margin-bottom:20px}'
    +'.brand{font-size:20px;font-weight:800;margin-bottom:4px}.brand span{color:#C8A96E}'
    +'.meta{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;font-size:13px}'
    +'.meta div{line-height:1.8}.lbl{color:#666;font-size:11px;text-transform:uppercase;font-weight:600}'
    +'table{width:100%;border-collapse:collapse;font-size:13px;margin-top:16px}'
    +'th,td{padding:9px 8px;border-bottom:1px solid #eee;text-align:left}'
    +'th{background:#f5f5f5;font-size:11px;text-transform:uppercase;color:#666}'
    +'.tot{font-weight:800;border-top:2px solid #111}'
    +'.sig{margin-top:60px;display:flex;justify-content:space-between}'
    +'.sig div{border-top:1px solid #999;padding-top:6px;font-size:12px;width:40%;text-align:center}'
    +'</style></head><body>'
    +'<div class="brand">APM <span>Metal Works</span></div>'
    +'<h1>Purchase Order '+(po?.po_no||'(Draft)')+'</h1>'
    +'<div class="meta">'
    +'<div><div class="lbl">Supplier</div>'+esc(sup)+'<br>'
    +'<div class="lbl" style="margin-top:10px">Project</div>'+(proj?esc(proj.name):'--')+'</div>'
    +'<div><div class="lbl">Issue date</div>'+fmtDate($('poDate').value)+'<br>'
    +'<div class="lbl" style="margin-top:10px">Delivery by</div>'+fmtDate($('poDel').value)+'<br>'
    +'<div class="lbl" style="margin-top:10px">Status</div>'+(ST[$('poStatus').value]?.label||'')+'</div>'
    +'</div>'
    +'<table><thead><tr><th>Description</th><th style="text-align:center">Qty</th><th style="text-align:right">Rate</th><th style="text-align:right">Amount</th></tr></thead>'
    +'<tbody>'+itemRows+'</tbody>'
    +'<tfoot>'
    +'<tr><td colspan="3" style="text-align:right">Subtotal</td><td style="text-align:right">SAR '+sub.toLocaleString()+'</td></tr>'
    +'<tr><td colspan="3" style="text-align:right">VAT 15%</td><td style="text-align:right">SAR '+vat.toLocaleString(undefined,{maximumFractionDigits:0})+'</td></tr>'
    +'<tr class="tot"><td colspan="3" style="text-align:right">Total</td><td style="text-align:right">SAR '+(sub+vat).toLocaleString(undefined,{maximumFractionDigits:0})+'</td></tr>'
    +'</tfoot></table>'
    +($('poNote').value?'<p style="margin-top:20px;font-size:13px;color:#555">Note: '+esc($('poNote').value)+'</p>':'')
    +'<div class="sig"><div>Authorised by</div><div>Supplier acknowledgement</div></div>'
    +'<scr'+'ipt>window.onload=function(){window.print();}<'+'/scr'+'ipt>'
    +'</body></html>');
  w.document.close();
}

loadAll();
</script>
</body>
</html>
