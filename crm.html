<!DOCTYPE html>
<html lang="en">
<head>
<!-- AUTH GUARD -->
<script>
(function(){
  var K='apm_erp_auth',T=8*60*60*1000;
  try{var r=sessionStorage.getItem(K);if(!r)throw 0;var d=JSON.parse(r);if(Date.now()-d.ts>T){sessionStorage.removeItem(K);throw 0;}}
  catch(e){var p=location.pathname.split('/').pop()+(location.search||'');location.replace('login.html?next='+encodeURIComponent(p));}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM — APM Metal Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg0:#0B0E12; --bg1:#12161C; --bg2:#1A2027; --bg3:#212935;
    --line:#242C36; --line-hi:#33404E;
    --text:#E8ECF1; --muted:#8C97A6;
    --amber:#F08C2E; --amber-soft:rgba(240,140,46,.14);
    --steel:#5B7A9D; --green:#3FB970; --red:#E5534B; --blue:#4D9DE0; --purple:#9B7EDE;
    --radius:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg0);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh}
  button{font-family:inherit}

  /* ---------- header ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px 24px;border-bottom:1px solid var(--line);
    background:rgba(18,22,28,.85);backdrop-filter:blur(8px);
    position:sticky;top:0;z-index:40;
  }
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
  .mark{width:36px;height:36px;border-radius:9px;background:linear-gradient(145deg,#222A33,#141A21);
    border:1px solid var(--line-hi);display:grid;place-items:center;
    font-family:'Saira',sans-serif;font-weight:800;font-size:14px;color:var(--amber)}
  .brand b{font-family:'Saira',sans-serif;font-weight:700;font-size:15px}
  .brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .topbar .actions{display:flex;gap:10px}

  .btn{
    border:1px solid var(--line-hi);background:var(--bg2);color:var(--text);
    padding:9px 16px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;
    transition:border-color .15s,background .15s;
  }
  .btn:hover{border-color:var(--amber)}
  .btn.primary{background:var(--amber);border-color:var(--amber);color:#1A1208}
  .btn.primary:hover{background:#FFA04A}
  .btn.danger{color:var(--red);border-color:rgba(229,83,75,.5)}
  .btn.sm{padding:6px 11px;font-size:12.5px}

  .wrap{max-width:1280px;margin:0 auto;padding:24px}

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:linear-gradient(180deg,var(--bg2),var(--bg1));border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .stat .lbl{color:var(--muted);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
  .stat .val{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:600;margin-top:6px}
  .stat .val.amber{color:var(--amber)} .stat .val.green{color:var(--green)}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  .tabs{display:flex;gap:4px;background:var(--bg1);border:1px solid var(--line);border-radius:10px;padding:4px}
  .tab{border:none;background:transparent;color:var(--muted);padding:8px 16px;border-radius:7px;font-size:13.5px;font-weight:600;cursor:pointer}
  .tab.active{background:var(--bg3);color:var(--text)}
  .search{
    flex:1;min-width:200px;max-width:340px;
    background:var(--bg1);border:1px solid var(--line);border-radius:9px;
    color:var(--text);padding:10px 14px;font-size:13.5px;font-family:inherit;
  }
  .search:focus{outline:none;border-color:var(--amber)}
  .spacer{flex:1}

  /* ---------- kanban ---------- */
  .board{display:grid;grid-template-columns:repeat(6,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
  @media(max-width:1100px){.board{display:flex}.col{min-width:255px}}
  .col{background:var(--bg1);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;max-height:72vh}
  .col.dragover{border-color:var(--amber);background:rgba(240,140,46,.04)}
  .col-head{display:flex;align-items:center;gap:8px;padding:13px 14px;border-bottom:1px solid var(--line)}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .col-head h3{font-family:'Saira',sans-serif;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex:1}
  .col-head .cnt{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted)}
  .col-sum{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);padding:7px 14px;border-bottom:1px solid var(--line)}
  .col-body{padding:10px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;flex:1;min-height:60px}

  .lead{
    background:var(--bg2);border:1px solid var(--line-hi);border-radius:10px;
    padding:12px 13px;cursor:grab;transition:border-color .15s,transform .12s;
  }
  .lead:hover{border-color:var(--amber)}
  .lead:active{cursor:grabbing}
  .lead.dragging{opacity:.45;transform:rotate(1.5deg)}
  .lead h4{font-size:13.5px;font-weight:600;margin-bottom:5px;line-height:1.35}
  .lead .who{color:var(--muted);font-size:12px;margin-bottom:8px}
  .lead .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .lead .val{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--amber);font-weight:600}
  .lead .date{font-size:11px;color:var(--muted)}
  .empty-col{color:var(--muted);font-size:12px;text-align:center;padding:14px 6px;border:1px dashed var(--line);border-radius:9px}

  /* ---------- tables ---------- */
  .panel{background:var(--bg1);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{
    text-align:left;padding:12px 16px;color:var(--muted);font-size:11.5px;
    letter-spacing:.09em;text-transform:uppercase;font-weight:600;
    border-bottom:1px solid var(--line);background:var(--bg2);white-space:nowrap;
  }
  td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:rgba(255,255,255,.02)}
  .mono{font-family:'JetBrains Mono',monospace;font-size:12.5px}
  .pill{display:inline-block;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid}
  .muted{color:var(--muted)}
  .rowbtns{display:flex;gap:6px;justify-content:flex-end}
  .iconbtn{
    border:1px solid var(--line-hi);background:transparent;color:var(--muted);
    width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1;
  }
  .iconbtn:hover{color:var(--text);border-color:var(--amber)}
  a.wa{color:var(--green);text-decoration:none;font-size:13px}
  a.wa:hover{text-decoration:underline}
  .empty-state{padding:48px 20px;text-align:center;color:var(--muted);font-size:14px}
  .empty-state b{color:var(--text)}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(5,8,12,.7);backdrop-filter:blur(3px);
    display:none;align-items:flex-start;justify-content:center;z-index:60;padding:6vh 16px;overflow-y:auto;
  }
  .overlay.open{display:flex}
  .modal{
    background:var(--bg1);border:1px solid var(--line-hi);border-radius:16px;
    width:100%;max-width:520px;padding:24px;
  }
  .modal h2{font-family:'Saira',sans-serif;font-size:19px;font-weight:700;margin-bottom:18px}
  .field{margin-bottom:14px}
  .field label{display:block;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
  .field input,.field select,.field textarea{
    width:100%;background:var(--bg0);border:1px solid var(--line-hi);border-radius:9px;
    color:var(--text);padding:10px 12px;font-size:14px;font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:70px}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--amber)}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:520px){.frow{grid-template-columns:1fr}}
  .modal-foot{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
  .modal-foot .right{display:flex;gap:10px;margin-left:auto}

  /* ---------- toast ---------- */
  #toasts{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:9px;z-index:90}
  .toast{
    background:var(--bg2);border:1px solid var(--line-hi);border-left:3px solid var(--amber);
    border-radius:10px;padding:12px 16px;font-size:13.5px;min-width:230px;
    animation:slidein .22s ease;
  }
  .toast.err{border-left-color:var(--red)}
  @keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}

  .loading{padding:60px;text-align:center;color:var(--muted)}
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="index.html">
    <div class="mark">AP</div>
    <div><b>CRM</b><small>APM Metal Works</small></div>
  </a>
  <div class="actions">
    <button class="btn" onclick="openContactModal()">+ Contact</button>
    <button class="btn primary" onclick="openLeadModal()">+ Lead</button>
  </div>
</div>

<div class="wrap">
  <div class="stats">
    <div class="stat"><div class="lbl">Contacts</div><div class="val" id="stContacts">—</div></div>
    <div class="stat"><div class="lbl">Open Leads</div><div class="val" id="stOpen">—</div></div>
    <div class="stat"><div class="lbl">Pipeline Value</div><div class="val amber" id="stPipeline">—</div></div>
    <div class="stat"><div class="lbl">Won This Month</div><div class="val green" id="stWon">—</div></div>
  </div>

  <div class="toolbar">
    <div class="tabs">
      <button class="tab active" data-view="pipeline" onclick="switchView('pipeline')">Pipeline</button>
      <button class="tab" data-view="leads" onclick="switchView('leads')">Leads</button>
      <button class="tab" data-view="contacts" onclick="switchView('contacts')">Contacts</button>
    </div>
    <input class="search" id="search" placeholder="Search…" oninput="renderAll()">
  </div>

  <div id="viewPipeline"><div class="loading">Loading pipeline…</div></div>
  <div id="viewLeads" style="display:none"></div>
  <div id="viewContacts" style="display:none"></div>
</div>

<!-- Contact modal -->
<div class="overlay" id="contactOverlay">
  <div class="modal">
    <h2 id="contactModalTitle">New contact</h2>
    <input type="hidden" id="cId">
    <div class="field"><label>Name *</label><input id="cName" placeholder="Eng. Ahmed Al-Qahtani"></div>
    <div class="frow">
      <div class="field"><label>Company</label><input id="cCompany" placeholder="Al-Rajhi Steel"></div>
      <div class="field"><label>City</label><input id="cCity" placeholder="Riyadh"></div>
    </div>
    <div class="frow">
      <div class="field"><label>Phone</label><input id="cPhone" placeholder="9665XXXXXXXX"></div>
      <div class="field"><label>Email</label><input id="cEmail" placeholder="name@company.com"></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="cNotes"></textarea></div>
    <div class="modal-foot">
      <button class="btn danger" id="cDelete" style="display:none" onclick="deleteContact()">Delete</button>
      <div class="right">
        <button class="btn" onclick="closeModals()">Cancel</button>
        <button class="btn primary" onclick="saveContact()">Save contact</button>
      </div>
    </div>
  </div>
</div>

<!-- Lead modal -->
<div class="overlay" id="leadOverlay">
  <div class="modal">
    <h2 id="leadModalTitle">New lead</h2>
    <input type="hidden" id="lId">
    <div class="field"><label>Title *</label><input id="lTitle" placeholder="Steel staircase — villa project"></div>
    <div class="field"><label>Contact</label><select id="lContact"></select></div>
    <div class="frow">
      <div class="field"><label>Value (SAR)</label><input id="lValue" type="number" min="0" step="any" placeholder="25000"></div>
      <div class="field"><label>Stage</label>
        <select id="lStage">
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="quoted">Quoted</option>
          <option value="negotiation">Negotiation</option>
          <option value="won">Won</option>
          <option value="lost">Lost</option>
        </select>
      </div>
    </div>
    <div class="frow">
      <div class="field"><label>Expected close</label><input id="lClose" type="date"></div>
      <div class="field"><label>Source</label>
        <select id="lSource">
          <option value="">—</option>
          <option>Referral</option><option>WhatsApp</option><option>Walk-in</option>
          <option>Phone</option><option>Repeat client</option><option>Other</option>
        </select>
      </div>
    </div>
    <div class="field"><label>Notes</label><textarea id="lNotes"></textarea></div>
    <div class="modal-foot">
      <button class="btn danger" id="lDelete" style="display:none" onclick="deleteLead()">Delete</button>
      <div class="right">
        <button class="btn" onclick="closeModals()">Cancel</button>
        <button class="btn primary" onclick="saveLead()">Save lead</button>
      </div>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
const SB_URL = 'https://spfztpokbpomqtiqgggz.supabase.co';
const SB_KEY = 'sb_publishable_xPXU0xL_YaiWA6k9PWc0Xg_4QYeypNi';
const sb = supabase.createClient(SB_URL, SB_KEY);

const STAGES = [
  { id:'new',         label:'New',         color:'#4D9DE0' },
  { id:'contacted',   label:'Contacted',   color:'#9B7EDE' },
  { id:'quoted',      label:'Quoted',      color:'#F08C2E' },
  { id:'negotiation', label:'Negotiation', color:'#E8C547' },
  { id:'won',         label:'Won',         color:'#3FB970' },
  { id:'lost',        label:'Lost',        color:'#E5534B' },
];
const stageById = id => STAGES.find(s => s.id === id) || STAGES[0];

let contacts = [];
let leads = [];
let currentView = 'pipeline';

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => (s ?? '').toString()
  .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
  .replaceAll('"','&quot;').replaceAll("'",'&#39;');
const fmtSAR = n => 'SAR ' + Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 0 });
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-GB', { day:'numeric', month:'short' }) : '';
const contactById = id => contacts.find(c => c.id === id);
const waLink = phone => 'https://wa.me/' + (phone || '').replace(/\D/g, '');

function toast(msg, isErr) {
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

/* ---------- data ---------- */
async function loadAll() {
  const [cRes, lRes] = await Promise.all([
    sb.from('crm_contacts').select('*').order('name'),
    sb.from('crm_leads').select('*').order('created_at', { ascending:false }),
  ]);
  if (cRes.error || lRes.error) {
    toast('Could not load data: ' + (cRes.error || lRes.error).message, true);
    $('viewPipeline').innerHTML = '<div class="empty-state">Could not reach the database.<br>Check that the CRM tables exist in Supabase (run crm_setup.sql).</div>';
    return;
  }
  contacts = cRes.data;
  leads = lRes.data;
  renderAll();
}

/* ---------- rendering ---------- */
function renderAll() {
  renderStats();
  if (currentView === 'pipeline') renderPipeline();
  if (currentView === 'leads') renderLeads();
  if (currentView === 'contacts') renderContacts();
}

function filtered(list, fields) {
  const q = $('search').value.trim().toLowerCase();
  if (!q) return list;
  return list.filter(item => fields.some(f => {
    let v = item[f];
    if (f === '_contact') v = (contactById(item.contact_id)?.name || '') + ' ' + (contactById(item.contact_id)?.company || '');
    return (v || '').toString().toLowerCase().includes(q);
  }));
}

function renderStats() {
  const open = leads.filter(l => l.stage !== 'won' && l.stage !== 'lost');
  const now = new Date();
  const wonMonth = leads.filter(l => {
    if (l.stage !== 'won') return false;
    const d = new Date(l.won_at || l.created_at);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
  $('stContacts').textContent = contacts.length;
  $('stOpen').textContent = open.length;
  $('stPipeline').textContent = fmtSAR(open.reduce((s, l) => s + Number(l.value || 0), 0));
  $('stWon').textContent = fmtSAR(wonMonth.reduce((s, l) => s + Number(l.value || 0), 0));
}

function leadCard(l) {
  const c = contactById(l.contact_id);
  return `
    <div class="lead" draggable="true" data-id="${l.id}"
         ondragstart="dragStart(event)" ondragend="dragEnd(event)"
         onclick="openLeadModal('${l.id}')">
      <h4>${esc(l.title)}</h4>
      <div class="who">${esc(c ? c.name + (c.company ? ' · ' + c.company : '') : 'No contact')}</div>
      <div class="row">
        <span class="val">${fmtSAR(l.value)}</span>
        <span class="date">${l.expected_close ? '⏱ ' + fmtDate(l.expected_close) : ''}</span>
      </div>
    </div>`;
}

function renderPipeline() {
  const list = filtered(leads, ['title', 'notes', '_contact']);
  const cols = STAGES.map(s => {
    const items = list.filter(l => l.stage === s.id);
    const sum = items.reduce((t, l) => t + Number(l.value || 0), 0);
    return `
      <div class="col" data-stage="${s.id}"
           ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event)">
        <div class="col-head">
          <span class="dot" style="background:${s.color}"></span>
          <h3>${s.label}</h3>
          <span class="cnt">${items.length}</span>
        </div>
        <div class="col-sum">${fmtSAR(sum)}</div>
        <div class="col-body">
          ${items.map(leadCard).join('') || '<div class="empty-col">Drop leads here</div>'}
        </div>
      </div>`;
  }).join('');
  $('viewPipeline').innerHTML = `<div class="board">${cols}</div>`;
}

function renderLeads() {
  const list = filtered(leads, ['title', 'notes', 'source', '_contact']);
  if (!list.length) {
    $('viewLeads').innerHTML = '<div class="panel"><div class="empty-state"><b>No leads yet.</b><br>Add your first lead to start building the pipeline.</div></div>';
    return;
  }
  const rows = list.map(l => {
    const c = contactById(l.contact_id);
    const s = stageById(l.stage);
    return `
      <tr>
        <td><b>${esc(l.title)}</b></td>
        <td>${esc(c?.name || '—')}<div class="muted" style="font-size:12px">${esc(c?.company || '')}</div></td>
        <td class="mono">${fmtSAR(l.value)}</td>
        <td><span class="pill" style="color:${s.color};border-color:${s.color}55">${s.label}</span></td>
        <td class="mono muted">${l.expected_close ? fmtDate(l.expected_close) : '—'}</td>
        <td class="muted">${esc(l.source || '—')}</td>
        <td><div class="rowbtns"><button class="iconbtn" title="Edit" onclick="openLeadModal('${l.id}')">✎</button></div></td>
      </tr>`;
  }).join('');
  $('viewLeads').innerHTML = `
    <div class="panel"><table>
      <thead><tr><th>Lead</th><th>Contact</th><th>Value</th><th>Stage</th><th>Close</th><th>Source</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

function renderContacts() {
  const list = filtered(contacts, ['name', 'company', 'city', 'phone', 'email', 'notes']);
  if (!list.length) {
    $('viewContacts').innerHTML = '<div class="panel"><div class="empty-state"><b>No contacts yet.</b><br>Add clients, site engineers and procurement contacts here.</div></div>';
    return;
  }
  const rows = list.map(c => {
    const openCount = leads.filter(l => l.contact_id === c.id && l.stage !== 'won' && l.stage !== 'lost').length;
    return `
      <tr>
        <td><b>${esc(c.name)}</b></td>
        <td>${esc(c.company || '—')}</td>
        <td class="muted">${esc(c.city || '—')}</td>
        <td class="mono">${c.phone ? `<a class="wa" href="${waLink(c.phone)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">WhatsApp ↗</a>` : '—'}</td>
        <td class="muted">${esc(c.email || '—')}</td>
        <td class="mono muted">${openCount} open</td>
        <td><div class="rowbtns"><button class="iconbtn" title="Edit" onclick="openContactModal('${c.id}')">✎</button></div></td>
      </tr>`;
  }).join('');
  $('viewContacts').innerHTML = `
    <div class="panel"><table>
      <thead><tr><th>Name</th><th>Company</th><th>City</th><th>Phone</th><th>Email</th><th>Leads</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

function switchView(v) {
  currentView = v;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === v));
  $('viewPipeline').style.display = v === 'pipeline' ? '' : 'none';
  $('viewLeads').style.display = v === 'leads' ? '' : 'none';
  $('viewContacts').style.display = v === 'contacts' ? '' : 'none';
  renderAll();
}

/* ---------- drag & drop ---------- */
let dragId = null;
function dragStart(e) {
  dragId = e.currentTarget.dataset.id;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function dragEnd(e) { e.currentTarget.classList.remove('dragging'); }
function dragOver(e) { e.preventDefault(); e.currentTarget.classList.add('dragover'); }
function dragLeave(e) { e.currentTarget.classList.remove('dragover'); }
async function drop(e) {
  e.preventDefault();
  const col = e.currentTarget;
  col.classList.remove('dragover');
  const stage = col.dataset.stage;
  const lead = leads.find(l => l.id === dragId);
  if (!lead || lead.stage === stage) return;
  const old = lead.stage;
  lead.stage = stage;
  if (stage === 'won') lead.won_at = new Date().toISOString();
  renderAll();
  const patch = { stage };
  if (stage === 'won') patch.won_at = lead.won_at;
  const { error } = await sb.from('crm_leads').update(patch).eq('id', dragId);
  if (error) { lead.stage = old; renderAll(); toast('Update failed: ' + error.message, true); }
  else toast(`Moved to ${stageById(stage).label}`);
}

/* ---------- contact modal ---------- */
function openContactModal(id) {
  const c = id ? contactById(id) : null;
  $('contactModalTitle').textContent = c ? 'Edit contact' : 'New contact';
  $('cId').value = c?.id || '';
  $('cName').value = c?.name || '';
  $('cCompany').value = c?.company || '';
  $('cCity').value = c?.city || '';
  $('cPhone').value = c?.phone || '';
  $('cEmail').value = c?.email || '';
  $('cNotes').value = c?.notes || '';
  $('cDelete').style.display = c ? '' : 'none';
  $('contactOverlay').classList.add('open');
  $('cName').focus();
}

async function saveContact() {
  const id = $('cId').value;
  const rec = {
    name: $('cName').value.trim(),
    company: $('cCompany').value.trim() || null,
    city: $('cCity').value.trim() || null,
    phone: $('cPhone').value.trim() || null,
    email: $('cEmail').value.trim() || null,
    notes: $('cNotes').value.trim() || null,
  };
  if (!rec.name) return toast('Name is required', true);
  const q = id
    ? sb.from('crm_contacts').update(rec).eq('id', id)
    : sb.from('crm_contacts').insert(rec);
  const { error } = await q;
  if (error) return toast('Save failed: ' + error.message, true);
  closeModals();
  toast(id ? 'Contact updated' : 'Contact added');
  loadAll();
}

async function deleteContact() {
  const id = $('cId').value;
  if (!id || !confirm('Delete this contact? Their leads will stay but lose the link.')) return;
  const { error } = await sb.from('crm_contacts').delete().eq('id', id);
  if (error) return toast('Delete failed: ' + error.message, true);
  closeModals();
  toast('Contact deleted');
  loadAll();
}

/* ---------- lead modal ---------- */
function openLeadModal(id) {
  const l = id ? leads.find(x => x.id === id) : null;
  $('leadModalTitle').textContent = l ? 'Edit lead' : 'New lead';
  $('lId').value = l?.id || '';
  $('lContact').innerHTML = '<option value="">— No contact —</option>' +
    contacts.map(c => `<option value="${c.id}">${esc(c.name)}${c.company ? ' · ' + esc(c.company) : ''}</option>`).join('');
  $('lContact').value = l?.contact_id || '';
  $('lTitle').value = l?.title || '';
  $('lValue').value = l?.value ?? '';
  $('lStage').value = l?.stage || 'new';
  $('lClose').value = l?.expected_close || '';
  $('lSource').value = l?.source || '';
  $('lNotes').value = l?.notes || '';
  $('lDelete').style.display = l ? '' : 'none';
  $('leadOverlay').classList.add('open');
  $('lTitle').focus();
}

async function saveLead() {
  const id = $('lId').value;
  const stage = $('lStage').value;
  const rec = {
    title: $('lTitle').value.trim(),
    contact_id: $('lContact').value || null,
    value: Number($('lValue').value || 0),
    stage,
    expected_close: $('lClose').value || null,
    source: $('lSource').value || null,
    notes: $('lNotes').value.trim() || null,
  };
  if (!rec.title) return toast('Title is required', true);
  if (stage === 'won') {
    const existing = id ? leads.find(x => x.id === id) : null;
    if (!existing || existing.stage !== 'won') rec.won_at = new Date().toISOString();
  }
  const q = id
    ? sb.from('crm_leads').update(rec).eq('id', id)
    : sb.from('crm_leads').insert(rec);
  const { error } = await q;
  if (error) return toast('Save failed: ' + error.message, true);
  closeModals();
  toast(id ? 'Lead updated' : 'Lead added');
  loadAll();
}

async function deleteLead() {
  const id = $('lId').value;
  if (!id || !confirm('Delete this lead?')) return;
  const { error } = await sb.from('crm_leads').delete().eq('id', id);
  if (error) return toast('Delete failed: ' + error.message, true);
  closeModals();
  toast('Lead deleted');
  loadAll();
}

/* ---------- modals / misc ---------- */
function closeModals() {
  document.querySelectorAll('.overlay').forEach(o => o.classList.remove('open'));
}
document.querySelectorAll('.overlay').forEach(o =>
  o.addEventListener('click', e => { if (e.target === o) closeModals(); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModals(); });

loadAll();
</script>
</body>
</html>
