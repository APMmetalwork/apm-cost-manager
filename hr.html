<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR — APM Metal Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg0:#0B0E12;--bg1:#12161C;--bg2:#1A2027;--bg3:#212935;--line:#242C36;--line-hi:#33404E;--text:#E8ECF1;--muted:#8C97A6;--amber:#F08C2E;--amber-soft:rgba(240,140,46,.14);--green:#3FB970;--red:#E5534B;--blue:#4D9DE0;--yellow:#E8C547;--purple:#9B7EDE;--radius:12px}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg0);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh}
  button{font-family:inherit}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);background:rgba(18,22,28,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:40}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
  .mark{width:36px;height:36px;border-radius:9px;background:linear-gradient(145deg,#222A33,#141A21);border:1px solid var(--line-hi);display:grid;place-items:center;font-family:'Saira',sans-serif;font-weight:800;font-size:14px;color:var(--amber)}
  .brand b{font-family:'Saira',sans-serif;font-weight:700;font-size:15px}
  .brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .btn{border:1px solid var(--line-hi);background:var(--bg2);color:var(--text);padding:9px 16px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;transition:border-color .15s,background .15s}
  .btn:hover{border-color:var(--amber)}
  .btn.primary{background:var(--amber);border-color:var(--amber);color:#1A1208}.btn.primary:hover{background:#FFA04A}
  .btn.danger{color:var(--red);border-color:rgba(229,83,75,.5)}
  .btn.ghost{background:transparent}.btn.sm{padding:6px 11px;font-size:12.5px}
  .wrap{max-width:1180px;margin:0 auto;padding:24px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:linear-gradient(180deg,var(--bg2),var(--bg1));border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .stat .lbl{color:var(--muted);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
  .stat .val{font-family:'JetBrains Mono',monospace;font-size:23px;font-weight:600;margin-top:6px}
  .stat .val.amber{color:var(--amber)}.stat .val.green{color:var(--green)}.stat .val.blue{color:var(--blue)}
  .tabs{display:flex;gap:4px;background:var(--bg1);border:1px solid var(--line);border-radius:10px;padding:4px;width:fit-content;margin-bottom:18px}
  .tab{border:none;background:transparent;color:var(--muted);padding:8px 18px;border-radius:7px;font-size:13.5px;font-weight:600;cursor:pointer}
  .tab.active{background:var(--bg3);color:var(--text)}
  .toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .search{flex:1;min-width:200px;max-width:340px;background:var(--bg1);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:10px 14px;font-size:13.5px;font-family:inherit}
  .search:focus{outline:none;border-color:var(--amber)}
  .panel{background:var(--bg1);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;padding:12px 16px;color:var(--muted);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;border-bottom:1px solid var(--line);background:var(--bg2);white-space:nowrap}
  td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr.click{cursor:pointer}tbody tr.click:hover{background:rgba(255,255,255,.02)}
  .mono{font-family:'JetBrains Mono',monospace;font-size:12.5px}.muted{color:var(--muted)}
  .pill{display:inline-block;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid}
  .avatar{width:34px;height:34px;border-radius:9px;background:var(--bg3);border:1px solid var(--line-hi);display:inline-grid;place-items:center;font-family:'Saira',sans-serif;font-weight:700;font-size:13px;color:var(--amber);margin-right:10px;vertical-align:middle}
  .who{display:flex;align-items:center}
  .empty-state{padding:48px 20px;text-align:center;color:var(--muted);font-size:14px}.empty-state b{color:var(--text)}
  .rowbtns{display:flex;gap:6px;justify-content:flex-end}
  .iconbtn{border:1px solid var(--line-hi);background:transparent;color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:13px}
  .iconbtn:hover{color:var(--text);border-color:var(--amber)}
  .overlay{position:fixed;inset:0;background:rgba(5,8,12,.7);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:5vh 16px;overflow-y:auto}
  .overlay.open{display:flex}
  .modal{background:var(--bg1);border:1px solid var(--line-hi);border-radius:16px;width:100%;max-width:560px;padding:24px}
  .modal h2{font-family:'Saira',sans-serif;font-size:19px;font-weight:700;margin-bottom:18px}
  .field{margin-bottom:14px}
  .field label{display:block;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;background:var(--bg0);border:1px solid var(--line-hi);border-radius:9px;color:var(--text);padding:10px 12px;font-size:14px;font-family:inherit}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--amber)}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.frow{grid-template-columns:1fr}}
  .modal-foot{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.modal-foot .right{display:flex;gap:10px;margin-left:auto}
  #toasts{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:9px;z-index:90}
  .toast{background:var(--bg2);border:1px solid var(--line-hi);border-left:3px solid var(--amber);border-radius:10px;padding:12px 16px;font-size:13.5px;min-width:230px;animation:slidein .22s ease}
  .toast.err{border-left-color:var(--red)}.toast.ok{border-left-color:var(--green)}
  @keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
  .loading{padding:60px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="index.html"><div class="mark">AP</div><div><b>HR</b><small>APM Metal Works</small></div></a>
  <div class="actions">
    <button class="btn" onclick="openLeaveModal()">+ Log leave</button>
    <button class="btn primary" onclick="openEmpModal()">+ Employee</button>
  </div>
</div>
<div class="wrap">
  <div class="stats">
    <div class="stat"><div class="lbl">Employees</div><div class="val" id="stEmp">—</div></div>
    <div class="stat"><div class="lbl">On leave today</div><div class="val blue" id="stToday">—</div></div>
    <div class="stat"><div class="lbl">Monthly payroll</div><div class="val amber" id="stPayroll">—</div></div>
    <div class="stat"><div class="lbl">Pending leave</div><div class="val" id="stPending">—</div></div>
  </div>
  <div class="tabs">
    <button class="tab active" data-view="employees" onclick="switchView('employees')">Employees</button>
    <button class="tab" data-view="leave" onclick="switchView('leave')">Leave</button>
  </div>
  <div class="toolbar"><input class="search" id="search" placeholder="Search…" oninput="renderAll()"></div>
  <div id="viewEmployees"><div class="loading">Loading…</div></div>
  <div id="viewLeave" style="display:none"></div>
</div>

<!-- employee -->
<div class="overlay" id="empOverlay">
  <div class="modal">
    <h2 id="empTitle">New employee</h2>
    <input type="hidden" id="eId">
    <div class="frow">
      <div class="field"><label>Full name *</label><input id="eName" placeholder="Mohammed Hassan"></div>
      <div class="field"><label>Employee ID</label><input id="eCode" placeholder="auto if blank"></div>
    </div>
    <div class="frow">
      <div class="field"><label>Role / title</label><input id="eRole" placeholder="Welder"></div>
      <div class="field"><label>Department</label>
        <select id="eDept"><option>Fabrication</option><option>Installation</option><option>Welding</option><option>Admin</option><option>Procurement</option><option>Management</option></select>
      </div>
    </div>
    <div class="frow">
      <div class="field"><label>Iqama / ID no</label><input id="eIqama" placeholder="optional"></div>
      <div class="field"><label>Phone</label><input id="ePhone" placeholder="9665XXXXXXXX"></div>
    </div>
    <div class="frow">
      <div class="field"><label>Join date</label><input id="eJoin" type="date"></div>
      <div class="field"><label>Monthly salary (SAR)</label><input id="eSalary" type="number" min="0" step="any" placeholder="0"></div>
    </div>
    <div class="frow">
      <div class="field"><label>Annual leave (days)</label><input id="eLeaveDays" type="number" min="0" step="1" placeholder="21"></div>
      <div class="field"><label>Status</label>
        <select id="eStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn danger" id="eDelete" style="display:none" onclick="deleteEmp()">Delete</button>
      <div class="right"><button class="btn" onclick="closeModals()">Cancel</button><button class="btn primary" onclick="saveEmp()">Save</button></div>
    </div>
  </div>
</div>

<!-- leave -->
<div class="overlay" id="leaveOverlay">
  <div class="modal">
    <h2 id="leaveTitle">Log leave</h2>
    <input type="hidden" id="lId">
    <div class="field"><label>Employee *</label><select id="lEmp"></select></div>
    <div class="frow">
      <div class="field"><label>Type</label>
        <select id="lType"><option>Annual</option><option>Sick</option><option>Emergency</option><option>Unpaid</option><option>Hajj</option></select>
      </div>
      <div class="field"><label>Status</label>
        <select id="lStatus"><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select>
      </div>
    </div>
    <div class="frow">
      <div class="field"><label>From *</label><input id="lFrom" type="date" onchange="calcDays()"></div>
      <div class="field"><label>To *</label><input id="lTo" type="date" onchange="calcDays()"></div>
    </div>
    <div class="field"><label>Duration</label><input id="lDays" disabled></div>
    <div class="field"><label>Note</label><input id="lNote" placeholder="optional"></div>
    <div class="modal-foot">
      <button class="btn danger" id="lDelete" style="display:none" onclick="deleteLeave()">Delete</button>
      <div class="right"><button class="btn" onclick="closeModals()">Cancel</button><button class="btn primary" onclick="saveLeave()">Save</button></div>
    </div>
  </div>
</div>

<div id="toasts"></div>
<script>
const SB_URL='https://spfztpokbpomqtiqgggz.supabase.co';
const SB_KEY='sb_publishable_xPXU0xL_YaiWA6k9PWc0Xg_4QYeypNi';
const sb=supabase.createClient(SB_URL,SB_KEY);
let emps=[], leaves=[], view='employees';
const DEPT_COLOR={Fabrication:'#5B7A9D',Installation:'#4D9DE0',Welding:'#F08C2E',Admin:'#9B7EDE',Procurement:'#E8C547',Management:'#3FB970'};
const LV_STATUS={pending:{label:'Pending',color:'#E8C547'},approved:{label:'Approved',color:'#3FB970'},rejected:{label:'Rejected',color:'#E5534B'}};
const $=id=>document.getElementById(id);
const esc=s=>(s??'').toString().replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const fmtSAR0=n=>'SAR '+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
const fmtDate=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'—';
const todayISO=()=>new Date().toISOString().slice(0,10);
const initials=n=>(n||'?').split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
function toast(m,k){const t=document.createElement('div');t.className='toast '+(k||'ok');t.textContent=m;$('toasts').appendChild(t);setTimeout(()=>t.remove(),3800);}
const empById=id=>emps.find(e=>e.id===id);
function daysBetween(a,b){if(!a||!b)return 0;const d=(new Date(b)-new Date(a))/86400000;return d<0?0:Math.round(d)+1;}

async function loadAll(){
  const [eRes,lRes]=await Promise.all([
    sb.from('employees').select('*').order('name'),
    sb.from('leave_requests').select('*').order('from_date',{ascending:false}),
  ]);
  if(eRes.error){$('viewEmployees').innerHTML='<div class="panel"><div class="empty-state">Could not reach the database.<br>Run <b>hr_setup.sql</b> in Supabase first.</div></div>';toast('Load failed: '+eRes.error.message,'err');return;}
  emps=eRes.data; leaves=lRes.error?[]:lRes.data;
  renderAll();
}
function renderAll(){renderStats();view==='employees'?renderEmployees():renderLeave();}
function renderStats(){
  const t=todayISO();
  const onLeave=leaves.filter(l=>l.status==='approved'&&l.from_date<=t&&l.to_date>=t);
  $('stEmp').textContent=emps.filter(e=>e.status==='active').length;
  $('stToday').textContent=onLeave.length;
  $('stPayroll').textContent=fmtSAR0(emps.filter(e=>e.status==='active').reduce((s,e)=>s+Number(e.salary||0),0));
  $('stPending').textContent=leaves.filter(l=>l.status==='pending').length;
}
function switchView(v){view=v;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));
  $('viewEmployees').style.display=v==='employees'?'':'none';$('viewLeave').style.display=v==='leave'?'':'none';renderAll();}

function renderEmployees(){
  const term=$('search').value.trim().toLowerCase();
  let list=emps.slice();
  if(term) list=list.filter(e=>[e.name,e.role,e.department,e.emp_code].some(v=>(v||'').toLowerCase().includes(term)));
  if(!list.length){$('viewEmployees').innerHTML='<div class="panel"><div class="empty-state"><b>No employees yet.</b><br>Add your crew — welders, fabricators, installers and office staff.</div></div>';return;}
  const t=todayISO();
  const rows=list.map(e=>{
    const onLeave=leaves.some(l=>l.employee_id===e.id&&l.status==='approved'&&l.from_date<=t&&l.to_date>=t);
    const dc=DEPT_COLOR[e.department]||'#8C97A6';
    return `<tr class="click" onclick="openEmpModal('${e.id}')">
      <td><div class="who"><span class="avatar">${esc(initials(e.name))}</span><div><b>${esc(e.name)}</b><div class="muted" style="font-size:12px">${esc(e.emp_code||'')}</div></div></div></td>
      <td>${esc(e.role||'—')}</td>
      <td><span class="pill" style="color:${dc};border-color:${dc}55">${esc(e.department||'—')}</span></td>
      <td class="mono">${fmtSAR0(e.salary)}</td>
      <td>${e.status==='active'?(onLeave?'<span class="pill" style="color:#4D9DE0;border-color:#4D9DE055">On leave</span>':'<span class="pill" style="color:#3FB970;border-color:#3FB97055">Active</span>'):'<span class="pill muted" style="border-color:#33404E">Inactive</span>'}</td>
      <td><div class="rowbtns"><button class="iconbtn" title="Edit" onclick="event.stopPropagation();openEmpModal('${e.id}')">✎</button></div></td>
    </tr>`;
  }).join('');
  $('viewEmployees').innerHTML=`<div class="panel"><table>
    <thead><tr><th>Employee</th><th>Role</th><th>Department</th><th>Salary</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function renderLeave(){
  const term=$('search').value.trim().toLowerCase();
  let list=leaves.slice();
  if(term) list=list.filter(l=>{const e=empById(l.employee_id);return [e?.name,l.type,l.note].some(v=>(v||'').toLowerCase().includes(term));});
  if(!list.length){$('viewLeave').innerHTML='<div class="panel"><div class="empty-state"><b>No leave records.</b><br>Log annual, sick or emergency leave for any employee.</div></div>';return;}
  const rows=list.map(l=>{
    const e=empById(l.employee_id), s=LV_STATUS[l.status]||LV_STATUS.pending;
    return `<tr class="click" onclick="openLeaveModal('${l.id}')">
      <td><b>${esc(e?.name||'—')}</b></td>
      <td>${esc(l.type)}</td>
      <td class="mono muted">${fmtDate(l.from_date)} → ${fmtDate(l.to_date)}</td>
      <td class="mono">${daysBetween(l.from_date,l.to_date)} d</td>
      <td><span class="pill" style="color:${s.color};border-color:${s.color}55">${s.label}</span></td>
      <td><div class="rowbtns">
        ${l.status==='pending'?`<button class="iconbtn" title="Approve" style="color:#3FB970;border-color:#3FB97055" onclick="event.stopPropagation();setLeaveStatus('${l.id}','approved')">✓</button>
        <button class="iconbtn" title="Reject" style="color:#E5534B;border-color:#E5534B55" onclick="event.stopPropagation();setLeaveStatus('${l.id}','rejected')">✕</button>`:''}
        <button class="iconbtn" title="Edit" onclick="event.stopPropagation();openLeaveModal('${l.id}')">✎</button>
      </div></td>
    </tr>`;
  }).join('');
  $('viewLeave').innerHTML=`<div class="panel"><table>
    <thead><tr><th>Employee</th><th>Type</th><th>Dates</th><th>Days</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function nextEmpCode(){
  const p='APM-E-';
  const nums=emps.map(e=>e.emp_code).filter(c=>c&&c.startsWith(p)).map(c=>parseInt(c.slice(p.length),10)).filter(n=>!isNaN(n));
  return p+String((nums.length?Math.max(...nums):0)+1).padStart(3,'0');
}
function openEmpModal(id){
  const e=id?empById(id):null;
  $('eId').value=e?.id||''; $('empTitle').textContent=e?'Edit employee':'New employee';
  $('eName').value=e?.name||''; $('eCode').value=e?.emp_code||''; $('eRole').value=e?.role||'';
  $('eDept').value=e?.department||'Fabrication'; $('eIqama').value=e?.iqama||''; $('ePhone').value=e?.phone||'';
  $('eJoin').value=e?.join_date||''; $('eSalary').value=e?.salary??''; $('eLeaveDays').value=e?.annual_leave_days??21;
  $('eStatus').value=e?.status||'active'; $('eDelete').style.display=e?'':'none';
  $('empOverlay').classList.add('open'); $('eName').focus();
}
async function saveEmp(){
  const name=$('eName').value.trim(); if(!name) return toast('Name is required','err');
  const rec={name,emp_code:$('eCode').value.trim()||nextEmpCode(),role:$('eRole').value.trim()||null,
    department:$('eDept').value,iqama:$('eIqama').value.trim()||null,phone:$('ePhone').value.trim()||null,
    join_date:$('eJoin').value||null,salary:Number($('eSalary').value||0),
    annual_leave_days:Number($('eLeaveDays').value||21),status:$('eStatus').value};
  const id=$('eId').value;
  const q=id?sb.from('employees').update(rec).eq('id',id):sb.from('employees').insert(rec);
  const {error}=await q;
  if(error) return toast('Save failed: '+error.message,'err');
  closeModals(); toast(id?'Employee updated':'Employee added'); loadAll();
}
async function deleteEmp(){
  const id=$('eId').value; if(!id||!confirm('Delete this employee? Their leave records will remain.'))return;
  const {error}=await sb.from('employees').delete().eq('id',id);
  if(error) return toast('Delete failed: '+error.message,'err');
  closeModals(); toast('Employee deleted'); loadAll();
}

function openLeaveModal(id){
  const l=id?leaves.find(x=>x.id===id):null;
  $('lId').value=l?.id||''; $('leaveTitle').textContent=l?'Edit leave':'Log leave';
  $('lEmp').innerHTML=emps.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');
  $('lEmp').value=l?.employee_id||(emps[0]?.id||'');
  $('lType').value=l?.type||'Annual'; $('lStatus').value=l?.status||'pending';
  $('lFrom').value=l?.from_date||todayISO(); $('lTo').value=l?.to_date||todayISO();
  $('lNote').value=l?.note||''; $('lDelete').style.display=l?'':'none';
  calcDays(); $('leaveOverlay').classList.add('open');
}
function calcDays(){const d=daysBetween($('lFrom').value,$('lTo').value);$('lDays').value=d?d+' day'+(d>1?'s':''):'—';}
async function saveLeave(){
  const emp=$('lEmp').value; if(!emp) return toast('Pick an employee (add one first)','err');
  if(!$('lFrom').value||!$('lTo').value) return toast('From and to dates are required','err');
  if(daysBetween($('lFrom').value,$('lTo').value)<=0) return toast('To date must be on or after from date','err');
  const rec={employee_id:emp,type:$('lType').value,status:$('lStatus').value,
    from_date:$('lFrom').value,to_date:$('lTo').value,note:$('lNote').value.trim()||null};
  const id=$('lId').value;
  const q=id?sb.from('leave_requests').update(rec).eq('id',id):sb.from('leave_requests').insert(rec);
  const {error}=await q;
  if(error) return toast('Save failed: '+error.message,'err');
  closeModals(); toast(id?'Leave updated':'Leave logged'); loadAll();
}
async function setLeaveStatus(id,status){
  const {error}=await sb.from('leave_requests').update({status}).eq('id',id);
  if(error) return toast('Failed: '+error.message,'err');
  toast(status==='approved'?'Leave approved':'Leave rejected'); loadAll();
}
async function deleteLeave(){
  const id=$('lId').value; if(!id||!confirm('Delete this leave record?'))return;
  const {error}=await sb.from('leave_requests').delete().eq('id',id);
  if(error) return toast('Delete failed: '+error.message,'err');
  closeModals(); toast('Leave deleted'); loadAll();
}
function closeModals(){document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('open'));}
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeModals();}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModals();});
loadAll();
</script>
